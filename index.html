<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Happy Aquarium Style</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#102b45;
  color:white;
  overflow-x:hidden;
}

body{
  display:flex;
  justify-content:center;
}

#game{
  width:100%;
  max-width:900px;
  min-height:100vh;
  background:linear-gradient(#173d5c,#0b2238);
}

/* TOP BAR */
.topbar{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:linear-gradient(#2477a8,#145074);
  border-bottom:3px solid #0b304a;
  box-shadow:0 3px 8px #0008;
  position:relative;
  z-index:50;
}

.stat{
  min-width:75px;
  text-align:center;
  font-weight:bold;
  font-size:13px;
}

.stat span{
  display:block;
  margin-top:3px;
  font-size:18px;
  color:#ffe87a;
}

.level{
  background:#16466b;
  border-radius:30px;
  padding:6px 12px;
  border:2px solid #75d9ff;
}

/* AQUARIUM */
#aquarium{
  position:relative;
  height:590px;
  margin:10px;
  overflow:hidden;
  border-radius:18px;
  border:7px solid #5b321e;
  box-shadow:
    inset 0 0 25px #0008,
    0 5px 15px #0009;
  background:
    linear-gradient(
      to bottom,
      #57d9ef 0%,
      #229ac5 45%,
      #08759e 75%,
      #075875 100%
    );
}

/* water light */
#aquarium:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 25% 10%,#fff8 0 3%,transparent 25%),
    linear-gradient(110deg,transparent 20%,#ffffff15 30%,transparent 42%);
  pointer-events:none;
  z-index:1;
}

/* SAND */
#sand{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:105px;
  background:
    radial-gradient(circle,#d5ae68 2px,transparent 3px) 0 0/35px 25px,
    linear-gradient(#e8c47c,#b98643);
  z-index:2;
}

/* CASTLE */
.castle{
  position:absolute;
  left:30px;
  bottom:72px;
  width:135px;
  height:160px;
  z-index:3;
}

.castle-body{
  position:absolute;
  left:25px;
  bottom:0;
  width:85px;
  height:110px;
  background:linear-gradient(90deg,#b87943,#e3ae62,#a86838);
  border:4px solid #754521;
  border-radius:7px;
}

.tower{
  position:absolute;
  bottom:0;
  width:35px;
  height:135px;
  background:linear-gradient(90deg,#a86538,#e0a65d);
  border:4px solid #754521;
  border-radius:5px;
}

.tower.left{left:0}
.tower.right{right:0}

.roof{
  position:absolute;
  top:-30px;
  left:-8px;
  width:45px;
  height:35px;
  background:#b93732;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.window{
  position:absolute;
  width:12px;
  height:22px;
  background:#263e4b;
  border:2px solid #e4c275;
  border-radius:8px 8px 2px 2px;
}

.tower .window{
  top:25px;
  left:8px;
}

.door{
  position:absolute;
  bottom:0;
  left:35px;
  width:22px;
  height:40px;
  background:#4c2a1b;
  border-radius:15px 15px 0 0;
}

/* DECOR */
.rock{
  position:absolute;
  bottom:70px;
  width:70px;
  height:35px;
  border-radius:50% 55% 35% 45%;
  background:linear-gradient(#788a8f,#364b50);
  z-index:3;
}

.rock.r1{right:60px}
.rock.r2{
  right:150px;
  width:45px;
  height:25px;
}

.plant{
  position:absolute;
  bottom:67px;
  width:45px;
  height:100px;
  z-index:3;
}

.plant:before,
.plant:after{
  content:"";
  position:absolute;
  bottom:0;
  width:10px;
  height:100px;
  background:linear-gradient(#43b947,#126e36);
  border-radius:100% 0;
  transform-origin:bottom;
}

.plant:before{
  left:15px;
  transform:rotate(-22deg);
}

.plant:after{
  right:5px;
  transform:rotate(25deg);
}

.plant.p1{right:20px}
.plant.p2{right:230px;transform:scale(.75)}

/* FISH LAYER */
#fishLayer,
#eggLayer,
#effectLayer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#fishLayer{
  z-index:8;
}

.fish{
  position:absolute;
  width:88px;
  height:55px;
  transform:translate(-50%,-50%);
  transition:left .8s ease,top .8s ease;
  pointer-events:auto;
  cursor:pointer;
  z-index:8;
}

.fish svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.fish.baby{
  transform:translate(-50%,-50%) scale(.58);
}

.fish.selected{
  filter:drop-shadow(0 0 8px #fff);
}

.fish.breeding{
  animation:fishHug .55s ease-in-out infinite alternate;
}

@keyframes fishHug{
  from{transform:translate(-50%,-50%) scale(1)}
  to{transform:translate(-50%,-50%) scale(1.08)}
}

/* BUBBLES */
.bubble{
  position:absolute;
  bottom:-20px;
  width:9px;
  height:9px;
  border:2px solid #ffffff99;
  border-radius:50%;
  z-index:6;
  animation:bubbleUp 5s linear infinite;
}

@keyframes bubbleUp{
  0%{
    transform:translateY(0);
    opacity:.1;
  }
  15%{opacity:.8}
  100%{
    transform:translateY(-650px);
    opacity:0;
  }
}

/* EGGS */
.tankEgg{
  position:absolute;
  width:42px;
  height:50px;
  transform:translate(-50%,-50%);
  z-index:12;
  text-align:center;
  font-size:35px;
  transition:top 1.4s cubic-bezier(.2,.8,.25,1);
  filter:drop-shadow(0 2px 3px #0008);
}

.eggShell{
  display:inline-block;
  animation:eggPulse 1.2s ease-in-out infinite alternate;
}

@keyframes eggPulse{
  from{transform:scale(1)}
  to{transform:scale(1.08)}
}

.eggTime{
  display:block;
  margin-top:-4px;
  font-size:10px;
  font-weight:bold;
  background:#17334bcc;
  border-radius:8px;
  padding:2px 5px;
}

.tankEgg.hatching{
  animation:eggHatch .65s ease-in-out;
}

@keyframes eggHatch{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.2) rotate(-8deg)}
  65%{transform:translate(-50%,-50%) scale(.9) rotate(8deg)}
  100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
}

/* BREED EFFECT */
.heart{
  position:absolute;
  z-index:30;
  font-size:30px;
  pointer-events:none;
  animation:heartFloat 1.8s ease-out forwards;
}

@keyframes heartFloat{
  0%{
    transform:translate(-50%,0) scale(.4);
    opacity:0;
  }
  20%{
    opacity:1;
  }
  100%{
    transform:translate(-50%,-90px) scale(1.25) rotate(15deg);
    opacity:0;
  }
}

.spark{
  position:absolute;
  z-index:29;
  font-size:24px;
  animation:spark .9s ease-out forwards;
}

@keyframes spark{
  0%{
    transform:scale(.2);
    opacity:0;
  }
  30%{opacity:1}
  100%{
    transform:scale(1.8);
    opacity:0;
  }
}

.breedText{
  position:absolute;
  left:50%;
  top:34%;
  transform:translateX(-50%);
  z-index:31;
  background:#ffffffdd;
  color:#d52e5b;
  font-weight:bold;
  font-size:19px;
  padding:8px 17px;
  border-radius:20px;
  box-shadow:0 4px 12px #0006;
  animation:textPop 1.5s ease forwards;
}

@keyframes textPop{
  0%{transform:translateX(-50%) scale(.5);opacity:0}
  20%{transform:translateX(-50%) scale(1);opacity:1}
  80%{opacity:1}
  100%{transform:translateX(-50%) scale(.9);opacity:0}
}

.glow{
  position:absolute;
  left:50%;
  top:50%;
  width:100px;
  height:100px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#fff8a8;
  box-shadow:0 0 60px 30px #fff5;
  z-index:20;
  animation:glow 1.4s ease-out forwards;
}

@keyframes glow{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  30%{opacity:1}
  100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}
}

/* BOTTOM MENU */
#toolbar{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  padding:7px;
  background:#0b2a43;
  border-top:3px solid #39779c;
  position:sticky;
  bottom:0;
  z-index:50;
}

.tool{
  border:2px solid #4e8cad;
  background:linear-gradient(#287da8,#155475);
  color:white;
  border-radius:10px;
  min-height:58px;
  font-size:11px;
  font-weight:bold;
  box-shadow:0 3px 5px #0007;
}

.tool:active{
  transform:scale(.94);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}

.modal.show{
  display:flex;
}

.panel{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  background:linear-gradient(#1f5e7f,#12354e);
  border:3px solid #75d8ff;
  border-radius:18px;
  box-shadow:0 10px 30px #000;
  padding:18px;
}

.panel h2{
  text-align:center;
  margin-top:0;
}

.close{
  float:right;
  border:0;
  background:#c93636;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  font-weight:bold;
}

.choice{
  display:flex;
  gap:8px;
  margin:8px 0;
  padding:10px;
  background:#ffffff15;
  border:1px solid #ffffff33;
  border-radius:12px;
  align-items:center;
}

.choice button{
  margin-left:auto;
  background:#ffbd39;
  border:0;
  padding:8px 12px;
  border-radius:8px;
  font-weight:bold;
}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.shopItem{
  background:#ffffff12;
  border:1px solid #ffffff35;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.shopItem button{
  background:#ffbd39;
  border:0;
  border-radius:8px;
  padding:9px;
  font-weight:bold;
}

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#102d43ee;
  border:2px solid #6ed9ff;
  border-radius:20px;
  padding:10px 18px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
}

.infoBox{
  background:#ffffff12;
  border-radius:12px;
  padding:10px;
  margin:8px 0;
}

/* MOBILE */
@media(max-width:600px){
  #aquarium{
    height:530px;
    margin:5px;
    border-width:5px;
  }

  .topbar{
    height:58px;
  }

  .stat{
    min-width:58px;
    font-size:10px;
  }

  .stat span{
    font-size:15px;
  }

  #toolbar{
    grid-template-columns:repeat(3,1fr);
  }

  .tool{
    min-height:53px;
  }

  .castle{
    transform:scale(.8);
    transform-origin:bottom left;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="topbar">
    <div class="stat">
      🪙 COINS
      <span id="coins">500</span>
    </div>

    <div class="stat">
      🍖 FOOD
      <span id="food">30</span>
    </div>

    <div class="level">
      ⭐ LV <span id="level">1</span>
    </div>

    <div class="stat">
      🐟 FISH
      <span id="fishCount">3</span>
    </div>
  </div>

  <div id="aquarium">

    <div id="sand"></div>

    <div class="castle">
      <div class="castle-body">
        <div class="door"></div>
        <div class="window" style="left:15px;top:20px"></div>
        <div class="window" style="right:15px;top:20px"></div>
      </div>

      <div class="tower left">
        <div class="roof"></div>
        <div class="window"></div>
      </div>

      <div class="tower right">
        <div class="roof"></div>
        <div class="window"></div>
      </div>
    </div>

    <div class="rock r1"></div>
    <div class="rock r2"></div>

    <div class="plant p1"></div>
    <div class="plant p2"></div>

    <div id="fishLayer"></div>
    <div id="eggLayer"></div>
    <div id="effectLayer"></div>

  </div>

  <div id="toolbar">

    <button class="tool" onclick="feedAll()">
      🍖<br>FEED
    </button>

    <button class="tool" onclick="openBreed()">
      ❤️<br>BREED
    </button>

    <button class="tool" onclick="openShop()">
      🛒<br>SHOP
    </button>

    <button class="tool" onclick="openFishList()">
      🐟<br>MY FISH
    </button>

    <button class="tool" onclick="cleanTank()">
      🧽<br>CLEAN
    </button>

    <button class="tool" onclick="saveGame(true)">
      💾<br>SAVE
    </button>

  </div>
</div>

<div id="toast"></div>

<!-- BREED MODAL -->
<div class="modal" id="breedModal">
  <div class="panel">
    <button class="close" onclick="closeModal('breedModal')">×</button>

    <h2>❤️ BREEDING</h2>

    <div class="infoBox">
      Pilih ikan <b>JANTAN</b> dan <b>BETINA</b>.
      Kos breeding: 🪙 50
    </div>

    <div id="maleList"></div>
    <div id="femaleList"></div>

  </div>
</div>

<!-- SHOP MODAL -->
<div class="modal" id="shopModal">
  <div class="panel">
    <button class="close" onclick="closeModal('shopModal')">×</button>

    <h2>🛒 AQUARIUM SHOP</h2>

    <div class="shopGrid">

      <div class="shopItem">
        🍖
        <h3>Food</h3>
        <p>+10 Food</p>
        <button onclick="buyFood()">🪙 20</button>
      </div>

      <div class="shopItem">
        🐟
        <h3>Red Fish</h3>
        <p>New Fish</p>
        <button onclick="buyFish('red')">🪙 100</button>
      </div>

      <div class="shopItem">
        🐟
        <h3>Blue Fish</h3>
        <p>New Fish</p>
        <button onclick="buyFish('blue')">🪙 100</button>
      </div>

      <div class="shopItem">
        🐠
        <h3>Golden Fish</h3>
        <p>Rare</p>
        <button onclick="buyFish('gold')">🪙 200</button>
      </div>

      <div class="shopItem">
        🏰
        <h3>Castle</h3>
        <p>Decoration</p>
        <button onclick="buyDecor()">🪙 150</button>
      </div>

    </div>
  </div>
</div>

<!-- FISH LIST -->
<div class="modal" id="fishModal">
  <div class="panel">
    <button class="close" onclick="closeModal('fishModal')">×</button>
    <h2>🐟 MY FISH</h2>
    <div id="fishList"></div>
  </div>
</div>

<!-- FISH DETAIL -->
<div class="modal" id="fishDetailModal">
  <div class="panel">
    <button class="close" onclick="closeModal('fishDetailModal')">×</button>
    <div id="fishDetail"></div>
  </div>
</div>


<script>

/* =========================================================
   HAPPY AQUARIUM STYLE
   FULL SINGLE FILE GAME
========================================================= */

const SAVE_KEY = "HappyAquariumAndroid_v3";

let game = {
  coins:500,
  food:30,
  level:1,
  xp:0,
  decor:1,
  fish:[],
  eggs:[],
  nextEggId:1,
  nextFishId:1
};

let selectedFish = null;
let breedingPair = null;
let breedingBusy = false;

const fishTypes = {

  red:{
    name:"Red Guppy",
    color:"#ef4d4d",
    color2:"#ff9b63"
  },

  blue:{
    name:"Blue Guppy",
    color:"#32a9ff",
    color2:"#83e1ff"
  },

  gold:{
    name:"Golden Guppy",
    color:"#ffc52e",
    color2:"#fff078"
  },

  purple:{
    name:"Purple Guppy",
    color:"#a15aff",
    color2:"#e49bff"
  },

  green:{
    name:"Green Tropical",
    color:"#38d17c",
    color2:"#9bffb9"
  }
};


/* =========================================================
   SAVE / LOAD
========================================================= */

function loadGame(){

  try{

    const saved = localStorage.getItem(SAVE_KEY);

    if(saved){

      const data = JSON.parse(saved);

      game = Object.assign(game,data);

      if(!Array.isArray(game.fish))
        game.fish=[];

      if(!Array.isArray(game.eggs))
        game.eggs=[];

    }

  }catch(e){

    console.log("Save error",e);

  }

  if(!game.fish.length){

    addFish("red","female",true);
    addFish("blue","male",true);
    addFish("gold","female",true);

  }

  game.nextEggId = game.nextEggId || 1;
  game.nextFishId = game.nextFishId || 1;

  updateHUD();

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(show=true){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

  if(show)
    toast("💾 Game saved!");

}


/* =========================================================
   FISH
========================================================= */

function addFish(type,sex,baby=false){

  const id = game.nextFishId++;

  const fish = {

    id:id,

    type:type,

    sex:sex,

    name:fishTypes[type].name,

    x:20 + Math.random()*60,

    y:25 + Math.random()*45,

    vx:(Math.random()>.5?1:-1) *
       (.04 + Math.random()*.035),

    vy:(Math.random()-.5)*.015,

    hunger:100,

    health:100,

    age:baby ? 1 : 100,

    baby:baby,

    created:Date.now()

  };

  game.fish.push(fish);

  return fish;

}


/* =========================================================
   FISH SVG
========================================================= */

function fishSVG(f){

  const t = fishTypes[f.type] || fishTypes.red;

  const flip = f.vx < 0 ? -1 : 1;

  return `

  <svg viewBox="0 0 120 70">

    <g transform="translate(${flip===-1?120:0},0)
                    scale(${flip},1)">

      <!-- tail -->
      <path
        d="M23 35
           Q5 12 0 5
           Q8 35 0 65
           Q12 58 23 35Z"
        fill="${t.color}"
        stroke="#07364b"
        stroke-width="3"
      />

      <!-- body -->
      <ellipse
        cx="58"
        cy="35"
        rx="38"
        ry="24"
        fill="${t.color}"
        stroke="#07364b"
        stroke-width="3"
      />

      <!-- belly -->
      <ellipse
        cx="67"
        cy="44"
        rx="22"
        ry="11"
        fill="${t.color2}"
        opacity=".55"
      />

      <!-- top fin -->
      <path
        d="M50 14 Q60 -2 73 15"
        fill="${t.color2}"
        stroke="#07364b"
        stroke-width="3"
      />

      <!-- bottom fin -->
      <path
        d="M53 54 Q64 70 75 53"
        fill="${t.color2}"
        stroke="#07364b"
        stroke-width="3"
      />

      <!-- side fin -->
      <path
        d="M60 35 Q48 48 68 44"
        fill="${t.color2}"
        opacity=".8"
      />

      <!-- eye -->
      <circle
        cx="84"
        cy="27"
        r="7"
        fill="white"
        stroke="#07364b"
        stroke-width="2"
      />

      <circle
        cx="86"
        cy="27"
        r="3"
        fill="#111"
      />

      <!-- mouth -->
      <circle
        cx="96"
        cy="38"
        r="2"
        fill="#07364b"
      />

      <!-- scales -->
      <circle cx="48" cy="28" r="3" fill="${t.color2}" opacity=".7"/>
      <circle cx="58" cy="23" r="2.5" fill="${t.color2}" opacity=".7"/>
      <circle cx="67" cy="29" r="2.5" fill="${t.color2}" opacity=".7"/>

    </g>

  </svg>

  `;

}


/* =========================================================
   RENDER FISH
========================================================= */

function renderFish(){

  const layer = document.getElementById("fishLayer");

  layer.innerHTML="";

  game.fish.forEach(f=>{

    const el = document.createElement("div");

    el.className="fish";

    if(f.baby)
      el.classList.add("baby");

    if(
      breedingPair &&
      breedingPair.includes(f.id)
    )
      el.classList.add("breeding");

    el.id="fish-"+f.id;

    el.style.left=f.x+"%";
    el.style.top=f.y+"%";

    el.innerHTML=fishSVG(f);

    el.onclick=()=>showFishDetail(f.id);

    layer.appendChild(el);

  });

}


/* =========================================================
   UPDATE FISH VISUAL ONLY
========================================================= */

function updateFishVisual(f){

  const el=document.getElementById("fish-"+f.id);

  if(!el)return;

  el.style.left=f.x+"%";
  el.style.top=f.y+"%";

}


/* =========================================================
   FISH MOVEMENT
========================================================= */

let lastTime=Date.now();

function gameLoop(){

  const now=Date.now();

  const dt=Math.min(
    (now-lastTime)/1000,
    .1
  );

  lastTime=now;

  game.fish.forEach(f=>{

    if(
      breedingPair &&
      breedingPair.includes(f.id)
    ){
      return;
    }

    f.x += f.vx;

    f.y += f.vy;

    if(f.x>91){

      f.x=91;
      f.vx=-Math.abs(f.vx);

      updateFishVisual(f);
      renderFish();

    }

    if(f.x<9){

      f.x=9;
      f.vx=Math.abs(f.vx);

      updateFishVisual(f);
      renderFish();

    }

    if(f.y>70){

      f.y=70;
      f.vy=-Math.abs(f.vy);

    }

    if(f.y<20){

      f.y=20;
      f.vy=Math.abs(f.vy);

    }

    updateFishVisual(f);

    /* hunger */

    f.hunger -= dt*0.08;

    if(f.hunger<0)
      f.hunger=0;

    if(f.hunger<20)
      f.health -= dt*0.02;

    if(f.health<0)
      f.health=0;

    /* baby growth */

    if(f.baby){

      f.age += dt*0.04;

      if(f.age>=100){

        f.age=100;
        f.baby=false;

        toast("🐟 Anak ikan dah besar!");

        renderFish();

      }

    }

  });

  updateEggTimers(dt);

  requestAnimationFrame(gameLoop);

}


/* =========================================================
   FEED
========================================================= */

function feedAll(){

  if(game.food<=0){

    toast("🍖 Food habis!");

    return;

  }

  const amount=Math.min(
    game.food,
    game.fish.length*2
  );

  game.food-=amount;

  game.fish.forEach(f=>{

    f.hunger=Math.min(
      100,
      f.hunger+35
    );

    f.health=Math.min(
      100,
      f.health+5
    );

  });

  game.xp+=10;

  levelCheck();

  updateHUD();

  toast("🍖 Semua ikan dah makan!");

  createFoodParticles();

  saveGame(false);

}


/* =========================================================
   FOOD PARTICLES
========================================================= */

function createFoodParticles(){

  const aquarium=document.getElementById("aquarium");

  for(let i=0;i<15;i++){

    const el=document.createElement("div");

    el.innerHTML="🍖";

    el.style.position="absolute";
    el.style.left=(20+Math.random()*60)+"%";
    el.style.top="20%";
    el.style.zIndex="20";
    el.style.fontSize="16px";
    el.style.transition="top 1.2s ease,opacity 1.2s";

    aquarium.appendChild(el);

    setTimeout(()=>{

      el.style.top=(45+Math.random()*25)+"%";
      el.style.opacity="0";

    },50);

    setTimeout(()=>{
      el.remove();
    },1300);

  }

}


/* =========================================================
   BREED MODAL
========================================================= */

function openBreed(){

  if(breedingBusy){

    toast("❤️ Breeding sedang berlangsung!");

    return;

  }

  if(game.coins<50){

    toast("🪙 Perlu 50 coins.");

    return;

  }

  const males=game.fish.filter(
    f=>f.sex==="male"
  );

  const females=game.fish.filter(
    f=>f.sex==="female"
  );

  if(!males.length || !females.length){

    toast("❤️ Perlu ikan jantan + betina.");

    return;

  }

  document.getElementById("breedModal")
    .classList.add("show");

  document.getElementById("maleList").innerHTML=

    "<h3>♂ Pilih Jantan</h3>"+
    males.map(f=>`

      <div class="choice">

        <span>🐟 ${f.name}</span>

        <button
          onclick="selectMale(${f.id})">
          PILIH
        </button>

      </div>

    `).join("");

  document.getElementById("femaleList").innerHTML=

    "<h3>♀ Pilih Betina</h3>"+
    females.map(f=>`

      <div class="choice">

        <span>🐠 ${f.name}</span>

        <button
          onclick="selectFemale(${f.id})">
          PILIH
        </button>

      </div>

    `).join("");

}


/* =========================================================
   BREED SELECTION
========================================================= */

let breedMale=null;
let breedFemale=null;

function selectMale(id){

  breedMale=game.fish.find(
    f=>f.id===id
  );

  if(breedFemale){

    closeModal("breedModal");

    startBreeding(
      breedMale,
      breedFemale
    );

  }else{

    toast("♂ Jantan dipilih. Sekarang pilih betina.");

  }

}


function selectFemale(id){

  breedFemale=game.fish.find(
    f=>f.id===id
  );

  if(breedMale){

    closeModal("breedModal");

    startBreeding(
      breedMale,
      breedFemale
    );

  }else{

    toast("♀ Betina dipilih. Sekarang pilih jantan.");

  }

}


/* =========================================================
   BREEDING ANIMATION
========================================================= */

function startBreeding(male,female){

  if(breedingBusy)return;

  if(male.id===female.id){

    toast("Tak boleh ikan yang sama.");

    return;

  }

  if(game.coins<50){

    toast("🪙 Coins tak cukup.");

    return;

  }

  breedingBusy=true;

  game.coins-=50;

  updateHUD();

  /*
    Tentukan lokasi tengah aquarium
  */

  const centerX=50;
  const centerY=43;

  male.x=centerX-12;
  male.y=centerY;

  female.x=centerX+12;
  female.y=centerY;

  /*
    Pastikan ikan menghadap satu sama lain
  */

  male.vx=Math.abs(male.vx)||.05;
  female.vx=-Math.abs(female.vx)||-.05;

  male.vy=0;
  female.vy=0;

  breedingPair=[
    male.id,
    female.id
  ];

  renderFish();

  setTimeout(()=>{

    /*
      Dekatkan ikan
    */

    male.x=centerX-5;
    female.x=centerX+5;

    updateFishVisual(male);
    updateFishVisual(female);

  },300);


  /*
    LOVE HEART
  */

  setTimeout(()=>{

    showBreedText("❤️ LOVE ❤️");

    spawnHearts();

  },900);


  /*
    PELUK
  */

  setTimeout(()=>{

    male.x=centerX-3;
    female.x=centerX+3;

    updateFishVisual(male);
    updateFishVisual(female);

    document
      .getElementById("fish-"+male.id)
      ?.classList.add("breeding");

    document
      .getElementById("fish-"+female.id)
      ?.classList.add("breeding");

    spawnGlow();

  },1700);


  /*
    EGG MUNCUL
  */

  setTimeout(()=>{

    spawnFallingEgg(
      male,
      female
    );

  },2700);

}


/* =========================================================
   HEARTS
========================================================= */

function spawnHearts(){

  const layer=document.getElementById("effectLayer");

  const hearts=[
    "❤️","💕","💗","💖","💞"
  ];

  for(let i=0;i<9;i++){

    const h=document.createElement("div");

    h.className="heart";

    h.innerHTML=
      hearts[
        Math.floor(
          Math.random()*hearts.length
        )
      ];

    h.style.left=
      (42+Math.random()*16)+"%";

    h.style.top=
      (38+Math.random()*13)+"%";

    h.style.animationDelay=
      (Math.random()*.4)+"s";

    layer.appendChild(h);

    setTimeout(()=>{
      h.remove();
    },2300);

  }

}


/* =========================================================
   BREED TEXT
========================================================= */

function showBreedText(text){

  const layer=document.getElementById("effectLayer");

  const el=document.createElement("div");

  el.className="breedText";

  el.innerHTML=text;

  layer.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },1600);

}


/* =========================================================
   GLOW
========================================================= */

function spawnGlow(){

  const layer=document.getElementById("effectLayer");

  const el=document.createElement("div");

  el.className="glow";

  layer.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },1500);

}


/* =========================================================
   FALLING EGG
========================================================= */

function spawnFallingEgg(male,female){

  const layer=document.getElementById("effectLayer");

  const egg=document.createElement("div");

  egg.className="tankEgg";

  egg.style.left="50%";
  egg.style.top="48%";

  egg.innerHTML=`
    <span class="eggShell">🥚</span>
  `;

  layer.appendChild(egg);

  /*
    Telur jatuh
  */

  setTimeout(()=>{

    egg.style.top="76%";

  },50);


  /*
    Selepas telur jatuh,
    masukkan ke dalam sistem egg sebenar
  */

  setTimeout(()=>{

    egg.remove();

    createRealEgg(
      male,
      female
    );

  },1550);

}


/* =========================================================
   CREATE REAL EGG
========================================================= */

function createRealEgg(male,female){

  const babyType =
    Math.random()>.5
      ? male.type
      : female.type;

  const sex =
    Math.random()>.5
      ? "male"
      : "female";

  const egg={

    id:game.nextEggId++,

    time:20,

    type:babyType,

    sex:sex,

    x:50,

    y:78,

    hatching:false

  };

  game.eggs.push(egg);

  breedingPair=null;

  /*
    Ikan dilepaskan semula
  */

  male.vx=.035;
  female.vx=-.035;

  male.vy=(Math.random()-.5)*.02;
  female.vy=(Math.random()-.5)*.02;

  renderFish();

  renderEggs();

  breedingBusy=false;

  breedMale=null;
  breedFemale=null;

  toast("🥚 Telur dah jatuh! Tunggu sampai menetas.");

  saveGame(false);

}


/* =========================================================
   RENDER EGGS
========================================================= */

function renderEggs(){

  const layer=document.getElementById("eggLayer");

  layer.innerHTML="";

  game.eggs.forEach(e=>{

    if(e.hatching)return;

    const el=document.createElement("div");

    el.className="tankEgg";

    el.id="egg-"+e.id;

    el.style.left=e.x+"%";
    el.style.top=e.y+"%";

    el.innerHTML=`

      <span class="eggShell">
        🥚
      </span>

      <span class="eggTime">
        ${Math.ceil(e.time)}s
      </span>

    `;

    layer.appendChild(el);

  });

}


/* =========================================================
   EGG TIMER
========================================================= */

function updateEggTimers(dt){

  game.eggs.forEach(e=>{

    if(e.hatching)return;

    e.time-=dt;

    const el=document.getElementById(
      "egg-"+e.id
    );

    if(el){

      const timer=
        el.querySelector(".eggTime");

      if(timer){

        timer.textContent=
          Math.max(0,Math.ceil(e.time))+"s";

      }

    }

    if(e.time<=0){

      e.time=0;

      e.hatching=true;

      hatchEgg(e);

    }

  });

}


/* =========================================================
   HATCH EGG
========================================================= */

function hatchEgg(egg){

  const el=document.getElementById(
    "egg-"+egg.id
  );

  if(el){

    el.classList.add("hatching");

  }

  /*
    Flash
  */

  setTimeout(()=>{

    const layer=document.getElementById(
      "effectLayer"
    );

    const spark=document.createElement("div");

    spark.className="spark";

    spark.innerHTML="✨";

    spark.style.left=egg.x+"%";
    spark.style.top=egg.y+"%";

    layer.appendChild(spark);

    setTimeout(()=>{
      spark.remove();
    },1000);

  },200);


  /*
    Spawn baby
  */

  setTimeout(()=>{

    game.eggs=
      game.eggs.filter(
        e=>e.id!==egg.id
      );

    const baby=addFish(
      egg.type,
      egg.sex,
      true
    );

    baby.x=egg.x;
    baby.y=egg.y-4;

    baby.age=1;

    renderEggs();
    renderFish();

    toast(
      "🐣 Telur menetas! Baby "+
      fishTypes[egg.type].name+
      " lahir!"
    );

    updateHUD();

    saveGame(false);

  },750);

}


/* =========================================================
   SHOP
========================================================= */

function openShop(){

  document
    .getElementById("shopModal")
    .classList.add("show");

}


function buyFood(){

  if(game.coins<20){

    toast("🪙 Coins tak cukup.");

    return;

  }

  game.coins-=20;

  game.food+=10;

  updateHUD();

  toast("🍖 +10 Food");

  saveGame(false);

}


function buyFish(type){

  const price =
    type==="gold"
      ? 200
      : 100;

  if(game.coins<price){

    toast("🪙 Coins tak cukup.");

    return;

  }

  if(game.fish.length>=20){

    toast("🐟 Aquarium dah penuh.");

    return;

  }

  game.coins-=price;

  addFish(
    type,
    Math.random()>.5?"male":"female"
  );

  renderFish();

  updateHUD();

  toast(
    "🐟 "+fishTypes[type].name+
    " dibeli!"
  );

  saveGame(false);

}


function buyDecor(){

  if(game.coins<150){

    toast("🪙 Coins tak cukup.");

    return;

  }

  game.coins-=150;

  game.decor++;

  updateHUD();

  toast("🏰 Decoration dibeli!");

  saveGame(false);

}


/* =========================================================
   FISH LIST
========================================================= */

function openFishList(){

  const modal=
    document.getElementById("fishModal");

  modal.classList.add("show");

  const list=
    document.getElementById("fishList");

  list.innerHTML=
    game.fish.map(f=>`

      <div class="choice">

        <span>
          ${f.sex==="male"?"♂":"♀"}
          ${f.name}
          ${f.baby?" 🐣":""}
        </span>

        <button
          onclick="showFishDetail(${f.id})">
          VIEW
        </button>

      </div>

    `).join("");

}


/* =========================================================
   FISH DETAIL
========================================================= */

function showFishDetail(id){

  const f=game.fish.find(
    x=>x.id===id
  );

  if(!f)return;

  selectedFish=f;

  closeModal("fishModal");

  document
    .getElementById("fishDetailModal")
    .classList.add("show");

  document
    .getElementById("fishDetail")
    .innerHTML=`

    <h2>🐟 ${f.name}</h2>

    <div class="infoBox">

      <p>
        <b>Sex:</b>
        ${f.sex==="male"?"♂ Male":"♀ Female"}
      </p>

      <p>
        <b>Health:</b>
        ${Math.round(f.health)}%
      </p>

      <p>
        <b>Hunger:</b>
        ${Math.round(f.hunger)}%
      </p>

      <p>
        <b>Age:</b>
        ${Math.round(f.age)}
      </p>

      <p>
        <b>Status:</b>
        ${f.baby?"🐣 Baby":"🐟 Adult"}
      </p>

    </div>

    <button
      style="
        width:100%;
        padding:13px;
        border:0;
        border-radius:10px;
        background:#ffbd39;
        font-weight:bold;
      "
      onclick="feedSingle(${f.id})">

      🍖 FEED FISH

    </button>

    <br><br>

    <button
      style="
        width:100%;
        padding:13px;
        border:0;
        border-radius:10px;
        background:#e04a4a;
        color:white;
        font-weight:bold;
      "
      onclick="sellFish(${f.id})">

      🪙 SELL FISH

    </button>

  `;

}


/* =========================================================
   FEED SINGLE
========================================================= */

function feedSingle(id){

  const f=game.fish.find(
    x=>x.id===id
  );

  if(!f)return;

  if(game.food<=0){

    toast("🍖 Food habis!");

    return;

  }

  game.food--;

  f.hunger=
    Math.min(100,f.hunger+40);

  f.health=
    Math.min(100,f.health+8);

  updateHUD();

  toast("🍖 "+f.name+" makan!");

  saveGame(false);

  showFishDetail(id);

}


/* =========================================================
   SELL FISH
========================================================= */

function sellFish(id){

  const index=
    game.fish.findIndex(
      x=>x.id===id
    );

  if(index===-1)return;

  const f=game.fish[index];

  const price=
    f.baby ? 40 :
    f.type==="gold" ? 180 :
    80;

  game.coins+=price;

  game.fish.splice(index,1);

  closeModal("fishDetailModal");

  renderFish();

  updateHUD();

  toast(
    "🪙 "+f.name+
    " dijual +"+price
  );

  saveGame(false);

}


/* =========================================================
   CLEAN
========================================================= */

function cleanTank(){

  game.xp+=15;

  levelCheck();

  updateHUD();

  toast("🧽 Aquarium dah bersih!");

  saveGame(false);

}


/* =========================================================
   LEVEL
========================================================= */

function levelCheck(){

  const required=
    game.level*100;

  if(game.xp>=required){

    game.xp-=required;

    game.level++;

    game.coins+=100;

    toast(
      "⭐ LEVEL UP! Level "+
      game.level
    );

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById("coins")
    .textContent=game.coins;

  document.getElementById("food")
    .textContent=game.food;

  document.getElementById("level")
    .textContent=game.level;

  document.getElementById("fishCount")
    .textContent=game.fish.length;

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    el.classList.remove("show");

  },2200);

}


/* =========================================================
   BUBBLES
========================================================= */

function createBubbles(){

  const aquarium=
    document.getElementById("aquarium");

  for(let i=0;i<18;i++){

    const b=
      document.createElement("div");

    b.className="bubble";

    b.style.left=
      Math.random()*95+"%";

    b.style.animationDelay=
      Math.random()*5+"s";

    b.style.animationDuration=
      (3+Math.random()*5)+"s";

    b.style.width=
      (5+Math.random()*9)+"px";

    b.style.height=b.style.width;

    aquarium.appendChild(b);

  }

}


/* =========================================================
   START
========================================================= */

loadGame();

renderFish();

renderEggs();

createBubbles();

gameLoop();


/* Autosave */
setInterval(()=>{

  saveGame(false);

},15000);

</script>
