<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ocean Home Aquarium</title>

<style>

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#08213b;
 color:white;
}

button{
 border:0;
 cursor:pointer;
 font-weight:bold;
}

#game{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 background:linear-gradient(#6fcde8,#087da9);
}


/* =========================
   TOP
========================= */

#top{
 height:68px;
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px;
 background:linear-gradient(#487da7,#244e72);
 box-shadow:0 3px 8px #0008;
 z-index:10;
}

.logo{
 font-size:19px;
 font-weight:bold;
 text-shadow:2px 2px #12334d;
 white-space:nowrap;
}

.stat{
 background:#123653dd;
 border:2px solid #8dd6f3;
 border-radius:11px;
 padding:4px 8px;
 text-align:center;
 min-width:66px;
}

.stat small{
 display:block;
 font-size:9px;
 color:#bdeaff;
}

.stat b{
 font-size:13px;
}


/* =========================
   AQUARIUM
========================= */

#tankArea{
 flex:1;
 position:relative;
 padding:7px;
 min-height:0;
}

#tank{
 position:relative;
 width:100%;
 height:100%;
 overflow:hidden;

 border:7px solid #9ecbe0;
 border-radius:18px 18px 5px 5px;

 background:
 radial-gradient(circle at 20% 15%,#ffffff55 0 2%,transparent 3%),
 radial-gradient(circle at 70% 25%,#ffffff25 0 1%,transparent 2%),
 linear-gradient(#59d1ed,#1c9fc4 55%,#08698e);

 box-shadow:inset 0 0 35px #003c5c99;
}

#waterLight{
 position:absolute;
 inset:0;
 pointer-events:none;

 background:
 linear-gradient(
  110deg,
  #ffffff22 0 8%,
  transparent 18% 70%,
  #ffffff15 80%,
  transparent
 );

 z-index:1;
}

#sand{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 height:17%;

 background:
 radial-gradient(
  circle at 20% 40%,
  #b98942 0 2px,
  transparent 3px
 ),
 radial-gradient(
  circle at 70% 60%,
  #a97b39 0 2px,
  transparent 3px
 ),
 linear-gradient(#f6dc98,#bd8d45);

 border-top:3px solid #ffe8ad;

 z-index:2;
}


/* =================================================
   DISNEYLAND-STYLE FANTASY CASTLE
================================================= */

.castle{
 position:absolute;
 left:5%;
 bottom:8%;
 width:180px;
 height:190px;
 z-index:4;
 filter:drop-shadow(0 6px 4px #003b4d99);
}


/* MAIN BUILDING */

.castle-main{
 position:absolute;
 left:42px;
 bottom:0;
 width:96px;
 height:115px;

 background:
 linear-gradient(
  90deg,
  #d7b5f3 0%,
  #f7e7ff 45%,
  #c99be7 100%
 );

 border:3px solid #70488e;
 border-radius:7px 7px 2px 2px;

 box-shadow:
 inset 5px 0 8px #ffffff55,
 inset -5px 0 8px #603b7755;
}


/* MAIN ROOF */

.castle-main:before{
 content:"";
 position:absolute;

 left:-9px;
 top:-42px;

 width:114px;
 height:50px;

 background:
 linear-gradient(
  90deg,
  #405bc9,
  #778bff,
  #3449ae
 );

 clip-path:
 polygon(
  50% 0,
  100% 100%,
  0 100%
 );

 border-bottom:3px solid #293d91;
}


/* MAIN DOOR */

.castle-door{
 position:absolute;

 left:34px;
 bottom:0;

 width:29px;
 height:52px;

 background:
 linear-gradient(
  90deg,
  #633a8a,
  #a46ac4,
  #543073
 );

 border:3px solid #48245f;

 border-radius:
  17px 17px 0 0;
}

.castle-door:after{
 content:"";

 position:absolute;

 right:4px;
 top:27px;

 width:5px;
 height:5px;

 border-radius:50%;

 background:#ffd75a;
}


/* MAIN WINDOWS */

.castle-window{
 position:absolute;

 width:18px;
 height:29px;

 background:
 linear-gradient(
  135deg,
  #c9f7ff,
  #51b9e9
 );

 border:3px solid #67427f;

 border-radius:
  10px 10px 3px 3px;

 box-shadow:
 inset 2px 2px 5px #ffffff99;
}

.cw1{
 left:12px;
 top:32px;
}

.cw2{
 right:12px;
 top:32px;
}


/* TOWERS */

.castle-tower{
 position:absolute;

 bottom:0;

 width:45px;
 height:148px;

 background:
 linear-gradient(
  90deg,
  #c79ae8,
  #f2dcff,
  #b784d4
 );

 border:3px solid #70488e;

 border-radius:
 7px 7px 2px 2px;

 box-shadow:
 inset 5px 0 8px #ffffff55,
 inset -5px 0 8px #603b7755;
}

.tower-left{
 left:0;
}

.tower-right{
 right:0;
}


/* CENTER TOWER */

.tower-center{
 left:68px;
 height:173px;
 z-index:3;
}


/* ROOFS */

.tower-roof{
 position:absolute;

 left:-9px;
 top:-46px;

 width:57px;
 height:55px;

 background:
 linear-gradient(
  90deg,
  #354fc1,
  #7589ff,
  #293da4
 );

 clip-path:
 polygon(
  50% 0,
  100% 100%,
  0 100%
 );

 border-bottom:3px solid #263a8d;
}


/* TOWER WINDOWS */

.tower-window{
 position:absolute;

 left:11px;
 top:35px;

 width:18px;
 height:30px;

 background:
 linear-gradient(
  135deg,
  #c9f7ff,
  #4caee0
 );

 border:3px solid #67427f;

 border-radius:
 10px 10px 3px 3px;
}


/* FLAG POLES */

.castle-tower:after{
 content:"";

 position:absolute;

 top:-82px;
 left:21px;

 width:3px;
 height:45px;

 background:#e8d19a;

 z-index:4;
}


/* FLAGS */

.flag{
 position:absolute;

 top:-77px;
 left:17px;

 font-size:29px;

 color:#ffd64d;

 text-shadow:
 1px 2px #633b78;

 z-index:5;
}


/* SMALL SIDE FLAGS */

.tower-left .flag{
 color:#ff7b9f;
}

.tower-right .flag{
 color:#7ee7ff;
}

.tower-center .flag{
 color:#ffd64d;
}


/* =========================
   ROCK
========================= */

.rock{
 position:absolute;
 z-index:3;

 filter:drop-shadow(
  0 5px 3px #003d4d99
 );
}

.rock.r1{
 right:5%;
 bottom:7%;
 font-size:55px;
}

.rock.r2{
 right:24%;
 bottom:7%;
 font-size:40px;
}


/* =========================
   PLANTS
========================= */

.plant1{
 position:absolute;
 left:39%;
 bottom:7%;
 font-size:57px;
 z-index:3;
}

.plant2{
 position:absolute;
 left:72%;
 bottom:7%;
 font-size:60px;
 z-index:3;
}


/* =========================
   FISH
========================= */

#fishLayer{
 position:absolute;
 inset:0;
 z-index:5;
}

.fish{
 position:absolute;

 width:115px;
 height:75px;

 transition:
  left .08s linear,
  top .08s linear;

 filter:
  drop-shadow(
   0 4px 3px #003b50aa
  );

 touch-action:none;

 cursor:pointer;
}

.fish.selected{
 filter:
  drop-shadow(
   0 0 10px #fff27a
  );
}


/* =========================
   BUBBLES
========================= */

.bubble{
 position:absolute;

 border:
 2px solid #d9fbff88;

 border-radius:50%;

 background:#ffffff22;

 animation:
  rise linear infinite;

 pointer-events:none;

 z-index:3;
}

@keyframes rise{

 from{
  transform:translateY(20px);
  opacity:.1;
 }

 50%{
  opacity:.7;
 }

 to{
  transform:translateY(-300px);
  opacity:0;
 }

}


/* =========================
   BREEDING FX
========================= */

#breedFX{
 position:absolute;
 inset:0;
 z-index:40;
 pointer-events:none;
}

.breedHeart{
 position:absolute;
 font-size:34px;
 animation:heartFloat 2s ease-out forwards;
}

@keyframes heartFloat{

 0%{
  transform:translate(-50%,0) scale(.4);
  opacity:0;
 }

 20%{
  opacity:1;
 }

 100%{
  transform:
   translate(-50%,-100px)
   scale(1.25)
   rotate(15deg);

  opacity:0;
 }

}

.breedLove{
 position:absolute;

 left:50%;
 top:30%;

 transform:
  translateX(-50%)
  scale(.5);

 background:#fff;

 color:#e73669;

 padding:9px 18px;

 border-radius:25px;

 font-size:20px;
 font-weight:bold;

 box-shadow:
 0 5px 15px #0007;

 animation:
 lovePop 1.7s ease forwards;
}

@keyframes lovePop{

 0%{
  opacity:0;
  transform:
   translateX(-50%)
   scale(.4);
 }

 20%{
  opacity:1;
  transform:
   translateX(-50%)
   scale(1.1);
 }

 70%{
  opacity:1;
 }

 100%{
  opacity:0;
  transform:
   translateX(-50%)
   scale(.9);
 }

}

.breedGlow{
 position:absolute;

 left:50%;
 top:48%;

 width:100px;
 height:100px;

 transform:
  translate(-50%,-50%);

 border-radius:50%;

 background:#fff4a0;

 box-shadow:
 0 0 60px 30px #fff5a8;

 animation:
 glowAnim 1.5s ease-out forwards;
}

@keyframes glowAnim{

 0%{
  transform:
   translate(-50%,-50%)
   scale(.2);

  opacity:0;
 }

 30%{
  opacity:1;
 }

 100%{
  transform:
   translate(-50%,-50%)
   scale(2.5);

  opacity:0;
 }

}


/* FALLING EGG */

.fallingEgg{
 position:absolute;

 left:50%;
 top:42%;

 transform:
  translate(-50%,-50%);

 font-size:42px;

 z-index:50;

 animation:
  eggFall 1.5s
  cubic-bezier(.2,.8,.25,1)
  forwards;
}

@keyframes eggFall{

 0%{
  top:42%;
  transform:
   translate(-50%,-50%)
   rotate(-10deg)
   scale(.7);

  opacity:0;
 }

 10%{
  opacity:1;
 }

 100%{
  top:78%;

  transform:
   translate(-50%,-50%)
   rotate(8deg)
   scale(1);
 }

}


/* =========================
   EGGS
========================= */

#eggLayer{
 position:absolute;
 inset:0;
 z-index:6;
 pointer-events:none;
}

.egg{
 position:absolute;

 transform:
  translate(-50%,-50%);

 font-size:35px;

 text-align:center;

 filter:
  drop-shadow(
   0 3px 3px #003b50aa
  );
}

.egg span{
 display:block;
}

.egg small{
 display:block;

 margin-top:-5px;

 background:#123653dd;

 border-radius:8px;

 padding:2px 5px;

 font-size:9px;
}


/* =========================
   BOTTOM
========================= */

#toolbar{
 height:88px;

 display:flex;

 justify-content:center;
 align-items:center;

 gap:6px;

 padding:6px;

 background:
  linear-gradient(
   #386582,
   #173c59
  );

 border-top:
 3px solid #8cc5df;

 z-index:10;
}

.tool{
 min-width:62px;
 height:70px;

 border-radius:13px;

 color:white;

 background:
  linear-gradient(
   #72a8c8,
   #315b7b
  );

 border:
 2px solid #a8d8ed;

 box-shadow:
 0 4px 0 #102d43,
  inset 0 1px #fff8;

 text-shadow:
 1px 2px #16364d;
}

.tool span{
 display:block;
 font-size:25px;
}

.tool small{
 font-size:9px;
}


/* =========================
   MODAL
========================= */

#modal{
 display:none;

 position:absolute;

 z-index:50;

 left:50%;
 top:50%;

 transform:
  translate(-50%,-50%);

 width:min(94%,400px);

 max-height:82%;

 overflow:auto;

 color:#18364d;

 background:
  linear-gradient(
   #effaff,
   #c9e9f7
  );

 border:
 4px solid #5788a5;

 border-radius:18px;

 padding:14px;

 box-shadow:
 0 15px 45px #000b;
}

#modal h2{
 text-align:center;
 margin:2px 0 12px;
}

.close{
 float:right;

 width:30px;
 height:30px;

 border-radius:50%;

 background:#d9534f;

 color:white;

 font-size:20px;
}

.card{
 background:#ffffffaa;

 border:
 2px solid #79a6bd;

 border-radius:11px;

 padding:9px;

 margin:7px 0;
}

.row{
 display:flex;

 align-items:center;

 justify-content:space-between;

 gap:6px;
}

.buy,
.blue,
.red{
 padding:9px 13px;

 border-radius:9px;

 color:white;
}

.buy{
 background:#389456;
}

.blue{
 background:#367fb4;
}

.red{
 background:#c94b47;
}

.progress{
 height:10px;

 background:#728996;

 border-radius:8px;

 overflow:hidden;

 margin:4px 0 7px;
}

.progress i{
 display:block;

 height:100%;

 background:#51ce69;
}


/* =========================
   TOAST
========================= */

#toast{
 display:none;

 position:absolute;

 z-index:100;

 left:50%;
 top:78px;

 transform:
  translateX(-50%);

 background:#102c45ee;

 border:
 2px solid #8ad8fa;

 border-radius:12px;

 padding:9px 15px;

 box-shadow:
 0 4px 15px #0007;
}


/* =========================
   START
========================= */

#start{
 position:absolute;

 z-index:200;

 inset:0;

 display:flex;

 justify-content:center;

 align-items:center;

 text-align:center;

 background:
  linear-gradient(
   #278db9,
   #08243e
  );
}

.startBox{
 width:min(90%,390px);

 padding:25px;

 border:
 4px solid #a6e2fa;

 border-radius:25px;

 background:#153f61ee;

 box-shadow:
 0 15px 50px #0009;
}

.startBox h1{
 font-size:32px;
 margin:5px;
}

.startBox p{
 color:#cef3ff;
 line-height:1.5;
}

.startBtn{
 padding:15px 30px;

 border-radius:14px;

 background:#f4c94b;

 color:#523800;

 font-size:18px;

 box-shadow:
 0 4px #8e6810;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

 #top{
  height:62px;
 }

 .logo{
  font-size:14px;
 }

 .stat{
  min-width:55px;
  padding:3px 5px;
 }

 .stat b{
  font-size:11px;
 }

 .tool{
  min-width:51px;
  height:67px;
 }

 .tool span{
  font-size:23px;
 }

 .castle{
  transform:
   scale(.82);

  transform-origin:
   bottom left;
 }

}

</style>
</head>


<body>


<div id="game">


<!-- =========================
     TOP
========================= -->

<div id="top">

 <div class="logo">
  🐠 Ocean Home
 </div>

 <div class="stat">
  <small>💰 COINS</small>
  <b id="coins">500</b>
 </div>

 <div class="stat">
  <small>🍖 FOOD</small>
  <b id="food">30</b>
 </div>

 <div class="stat">
  <small>⭐ LEVEL</small>
  <b id="level">1</b>
 </div>

 <div class="stat">
  <small>🐟 FISH</small>
  <b id="fishCount">0/12</b>
 </div>

</div>


<!-- =========================
     TANK
========================= -->

<div id="tankArea">

 <div id="tank">

  <div id="waterLight"></div>

  <div id="sand"></div>


  <!-- DISNEYLAND STYLE CASTLE -->

  <div class="castle">

   <div class="castle-main">

    <div class="castle-door"></div>

    <div class="castle-window cw1"></div>

    <div class="castle-window cw2"></div>

   </div>


   <div class="castle-tower tower-left">

    <div class="tower-roof"></div>

    <div class="tower-window"></div>

    <div class="flag">⚑</div>

   </div>


   <div class="castle-tower tower-right">

    <div class="tower-roof"></div>

    <div class="tower-window"></div>

    <div class="flag">⚑</div>

   </div>


   <div class="castle-tower tower-center">

    <div class="tower-roof"></div>

    <div class="tower-window"></div>

    <div class="flag">⚑</div>

   </div>

  </div>


  <!-- ROCKS -->

  <div class="rock r1">
   🪨
  </div>

  <div class="rock r2">
   🪨
  </div>


  <!-- PLANTS -->

  <div class="plant1">
   🌿
  </div>

  <div class="plant2">
   🌿
  </div>


  <!-- FISH -->

  <div id="fishLayer"></div>


  <!-- EGGS -->

  <div id="eggLayer"></div>


  <!-- BREEDING EFFECT -->

  <div id="breedFX"></div>


 </div>

</div>


<!-- =========================
     TOOLBAR
========================= -->

<div id="toolbar">

 <button class="tool"
 onclick="feedAll()">

  <span>🍖</span>

  <small>FEED</small>

 </button>


 <button class="tool"
 onclick="breedMenu()">

  <span>🥚</span>

  <small>BREED</small>

 </button>


 <button class="tool"
 onclick="shop()">

  <span>🏪</span>

  <small>SHOP</small>

 </button>


 <button class="tool"
 onclick="myFish()">

  <span>🐟</span>

  <small>MY FISH</small>

 </button>


 <button class="tool"
 onclick="cleanTank()">

  <span>🧽</span>

  <small>CLEAN</small>

 </button>


 <button class="tool"
 onclick="saveGame();toast('💾 Game disimpan')">

  <span>💾</span>

  <small>SAVE</small>

 </button>

</div>


</div>


<div id="toast"></div>

<div id="modal"></div>


<!-- START -->

<div id="start">

 <div class="startBox">

  <h1>
   🐠 Ocean Home
  </h1>

  <p>

   Bina akuarium sendiri.<br>

   Bela ikan, bagi makan,
   breeding, tetaskan telur,
   jual ikan, beli ikan
   dan hias akuarium.

  </p>

  <button
   class="startBtn"
   onclick="startGame()">

   MASUK AKUARIUM

  </button>

 </div>

</div>


<script>


/* =========================================================
   DATA IKAN
========================================================= */

const TYPES=[

 {
  name:"Guppy Merah",
  body:"#ef5962",
  fin:"#ffb34d",
  price:80
 },

 {
  name:"Guppy Biru",
  body:"#36a8e6",
  fin:"#a8efff",
  price:90
 },

 {
  name:"Guppy Ungu",
  body:"#a66be7",
  fin:"#efb7ff",
  price:120
 },

 {
  name:"Guppy Emas",
  body:"#f0ad2e",
  fin:"#fff0a0",
  price:160
 },

 {
  name:"Tropical Hijau",
  body:"#43c57b",
  fin:"#b8ff9c",
  price:140
 }

];


/* =========================================================
   SAVE DATA
========================================================= */

let game =
JSON.parse(
 localStorage.getItem("OceanHomeSave")
) ||
{

 coins:500,

 food:30,

 level:1,

 xp:0,

 nextId:4,

 fish:[

  {
   id:1,
   type:0,
   sex:"F",
   hunger:85,
   health:100,
   age:100,
   x:25,
   y:30,
   vx:.42,
   vy:.10
  },

  {
   id:2,
   type:1,
   sex:"M",
   hunger:80,
   health:100,
   age:100,
   x:60,
   y:46,
   vx:-.38,
   vy:.12
  },

  {
   id:3,
   type:3,
   sex:"F",
   hunger:90,
   health:100,
   age:100,
   x:43,
   y:60,
   vx:.32,
   vy:-.08
  }

 ],

 eggs:[]

};


let running=false;

let selectedFish=null;

let breedingBusy=false;

let lastTime=
 performance.now();


/* =========================================================
   START
========================================================= */

function startGame(){

 document
  .getElementById("start")
  .style.display="none";

 running=true;

 createBubbles();

 renderFish();

 renderEggs();

 updateHUD();

 requestAnimationFrame(loop);

 toast("🐠 Selamat datang!");

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

 localStorage.setItem(
  "OceanHomeSave",
  JSON.stringify(game)
 );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

 document
  .getElementById("coins")
  .textContent=game.coins;

 document
  .getElementById("food")
  .textContent=game.food;

 document
  .getElementById("level")
  .textContent=game.level;

 document
  .getElementById("fishCount")
  .textContent=
   game.fish.length+"/12";

}


/* =========================================================
   FISH SVG
========================================================= */

function fishSVG(f){

 const t=TYPES[f.type];

 const flip=
  f.vx<0 ? -1 : 1;

 return `

 <svg viewBox="0 0 120 78">

 <g transform="
 translate(${flip<0?120:0} 0)
 scale(${flip} 1)
 ">

 <path
 d="M35 38
 C10 10 5 15 7 38
 C5 61 14 68 35 39"
 fill="${t.fin}"
 stroke="#164c65"
 stroke-width="2"
 />

 <ellipse
 cx="63"
 cy="39"
 rx="35"
 ry="24"
 fill="${t.body}"
 stroke="#164c65"
 stroke-width="2"
 />

 <path
 d="M57 18
 Q70 3 80 20
 Q68 25 57 18"
 fill="${t.fin}"
 />

 <path
 d="M58 59
 Q72 75 80 57
 Q68 54 58 59"
 fill="${t.fin}"
 />

 <path
 d="M56 28 Q72 20 84 29"
 fill="none"
 stroke="#ffffff77"
 stroke-width="5"
 />

 <circle
 cx="83"
 cy="32"
 r="7"
 fill="white"
 />

 <circle
 cx="85"
 cy="32"
 r="3"
 fill="#111"
 />

 <path
 d="M99 38 Q108 40 99 44"
 fill="none"
 stroke="#164c65"
 stroke-width="2"
 />

 </g>

 </svg>

 `;

}


/* =========================================================
   RENDER FISH
========================================================= */

function renderFish(){

 const layer=
  document.getElementById(
   "fishLayer"
  );

 layer.innerHTML="";

 game.fish.forEach(f=>{

  const el=
   document.createElement("div");

  el.className="fish";

  if(
   selectedFish===f.id
  ){

   el.classList.add(
    "selected"
   );

  }

  el.id="fish-"+f.id;

  el.style.left=
   f.x+"%";

  el.style.top=
   f.y+"%";

  el.innerHTML=
   fishSVG(f);

  el.onclick=function(){

   selectFish(f.id);

  };

  layer.appendChild(el);

 });

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

 if(!running)return;

 let dt=
  Math.min(
   40,
   now-lastTime
  );

 lastTime=now;


 game.fish.forEach(f=>{

  if(
   breedingBusy &&
   f.breeding
  ){

   return;

  }


  f.x +=
   f.vx*dt/16;

  f.y +=
   f.vy*dt/16;


  if(f.x<3){

   f.x=3;

   f.vx=
    Math.abs(f.vx);

  }


  if(f.x>82){

   f.x=82;

   f.vx=
    -Math.abs(f.vx);

  }


  if(f.y<8){

   f.y=8;

   f.vy=
    Math.abs(f.vy);

  }


  if(f.y>72){

   f.y=72;

   f.vy=
    -Math.abs(f.vy);

  }


  /* hunger */

  f.hunger -=
   dt/1000/40;

  if(f.hunger<0)
   f.hunger=0;


  /* health */

  if(f.hunger<15){

   f.health -=
    dt/1000/30;

   if(f.health<0)
    f.health=0;

  }

  else{

   if(f.health<100){

    f.health +=
     dt/1000/80;

   }

   if(f.health>100)
    f.health=100;

  }


  /* age */

  f.age +=
   dt/1000/1200;


 });


 /* =====================
    EGGS
 ===================== */

 game.eggs.forEach(e=>{

  e.time -=
   dt/1000;

 });


 const ready=
  game.eggs.filter(
   e=>e.time<=0
  );


 ready.forEach(e=>{

  hatchEgg(e);

 });


 game.eggs=
  game.eggs.filter(
   e=>e.time>0
  );


 /* update fish */

 game.fish.forEach(f=>{

  const el=
   document.getElementById(
    "fish-"+f.id
   );

  if(el){

   el.style.left=
    f.x+"%";

   el.style.top=
    f.y+"%";

  }

 });


 updateEggVisuals();

 requestAnimationFrame(loop);

}

function breed(){

  );

 }

 if(game.coins<50){

  toast(
   "💰 Coins tak cukup."
  );

 if(game.fish.length>=12){

  );

  return;

 }

 const maleSelect=
  document.getElementById(
   "maleSelect"
  );

 const femaleSelect=
  document.getElementById(
   "femaleSelect"
  );

 if(!maleSelect ||
    !femaleSelect){

  return;

 }

 const m=
  game.fish.find(
   f=>f.id==maleSelect.value
  );

 const f=
  game.fish.find(
   f=>f.id==femaleSelect.value
  );


 if(!m || !f)return;


 if(m.hunger<30 ||
    f.hunger<30){

  toast(
   "🍖 Ikan terlalu lapar."
  );

  return;

 }


 game.coins-=50;

 m.hunger-=15;
 f.hunger-=15;


 m.breeding=true;
 f.breeding=true;

 breedingBusy=true;


 closeModal();

 updateHUD();

 renderFish();


 /* =====================
    IKAN BERGERAK KE TENGAH
 ===================== */

 const centerX=50;
 const centerY=43;

 m.x=
  centerX-13;

 m.y=
  centerY;

 f.x=
  centerX+13;

 f.y=
  centerY;

 m.vx=.42;
 f.vx=-.42;

 m.vy=0;
 f.vy=0;


 updateFishPosition(m);
 updateFishPosition(f);


 /* LOVE */

 setTimeout(()=>{

  showLove();

  createHearts();

 },700);

 setTimeout(()=>{

  m.x=
   centerX-5;

  f.x=
   centerX+5;

  updateFishPosition(m);
  updateFishPosition(f);

  createGlow();

  createHearts();

 },1700);

 setTimeout(()=>{

  );

 },2700);

/* =========================================================
   CREATE REAL EGG
========================================================= */

function createRealEgg(
 male,
 female
){

 const babyType=
  Math.random()<.5
  ? male.type
  : female.type;


 const egg={

  id:game.nextId++,

  time:20,

  type:babyType,

  sex:
   Math.random()<.5
   ?"M"
   :"F",

  x:
   45+
   Math.random()*10,

  y:78

 };


 game.eggs.push(
  egg
 );


 /* release fish */

 male.breeding=false;
 female.breeding=false;

 breedingBusy=false;

 male.vx=
  Math.abs(male.vx) ||
  .35;

 female.vx=
  -Math.abs(female.vx) ||
  -.35;

 male.vy=
  (Math.random()-.5)*.2;

 female.vy=
  (Math.random()-.5)*.2;


 renderFish();

 renderEggs();

 updateHUD();

 saveGame();

 toast(
  "🥚 Telur jatuh dalam aquarium!"
 );

}

   game.eggs=
    game.eggs.filter(
     x=>x.id!==e.id
    );

   renderEggs();

   return;

  }


  game.fish.push({

   id:game.nextId++,

   type:e.type,

   sex:e.sex,

   hunger:100,

   health:100,

   age:5,

   x:
    20+
    Math.random()*55,

   y:

    Math.random()*35,

   vx:

     ?-1
     :1)*.3,

   );

  saveGame();

  updateHUD();

  renderEggs();

 },800);
