<!DOCTYPE html>

<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Aquarium</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#087da8;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.ui{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
}

.box{
    background:rgba(0,20,35,.8);
    color:white;
    padding:10px 15px;
    border-radius:20px;
    font-weight:bold;
}

.buttons{
    position:absolute;
    bottom:15px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    z-index:10;
}

button{
    border:0;
    border-radius:14px;
    padding:12px 15px;
    background:#087fb8;
    color:white;
    font-weight:bold;
    box-shadow:0 4px 0 #034d70;
}

button:active{
    transform:translateY(3px);
}
</style>

</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="ui">
    <div class="box">🐠 HAPPY AQUARIUM</div>
    <div class="box">🪙 <span id="coins">100</span></div>
</div>

<div class="buttons">
    <button onclick="feed()">🍤 FEED</button>
    <button onclick="addFish()">🐟 BUY FISH</button>
    <button onclick="breed()">🥚 BREED</button>
    <button onclick="clean()">🧽 CLEAN</button>
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;

let coins = 100;

let fishes = [
    {
        x:0.20,
        y:0.40,
        dx:1,
        color:"#ff8c20"
    },
    {
        x:0.50,
        y:0.55,
        dx:-1,
        color:"#2878ff"
    },
    {
        x:0.75,
        y:0.35,
        dx:1,
        color:"#ffd42a"
    },
    {
        x:0.35,
        y:0.65,
        dx:1,
        color:"#ff4f70"
    }
];

let bubbles=[];

for(let i=0;i<35;i++){

    bubbles.push({
        x:Math.random(),
        y:Math.random(),
        size:1+Math.random()*4,
        speed:.0005+Math.random()*.001
    });

}

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;

}

window.addEventListener("resize",resize);

resize();


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

    let gradient=ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    gradient.addColorStop(0,"#54dfff");
    gradient.addColorStop(.35,"#078fbd");
    gradient.addColorStop(1,"#034563");

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* light */

    ctx.fillStyle="rgba(255,255,255,.08)";

    for(let i=0;i<7;i++){

        ctx.beginPath();

        ctx.moveTo(
            i*W/6,
            0
        );

        ctx.lineTo(
            i*W/6+W*.15,
            H*.75
        );

        ctx.lineTo(
            i*W/6+W*.25,
            H*.75
        );

        ctx.lineTo(
            i*W/6+W*.1,
            0
        );

        ctx.fill();

    }

}


/* =========================
   SAND
========================= */

function drawSand(){

    let y=H*.80;

    ctx.fillStyle="#d6ad65";

    ctx.beginPath();

    ctx.moveTo(0,y);

    for(let x=0;x<=W;x+=20){

        let wave=
            Math.sin(x*.02)*4;

        ctx.lineTo(
            x,
            y+wave
        );

    }

    ctx.lineTo(W,H);

    ctx.lineTo(0,H);

    ctx.closePath();

    ctx.fill();


    /* rocks */

    for(let i=0;i<12;i++){

        let x=(i*97)%W;

        let yy=y+20+(i%4)*10;

        ctx.fillStyle="#555";

        ctx.beginPath();

        ctx.ellipse(
            x,
            yy,
            15,
            8,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================
   PLANTS
========================= */

function drawPlants(){

    for(let i=0;i<14;i++){

        let x=i*W/13;

        let height=
            H*.12+
            Math.sin(i)*20;

        ctx.strokeStyle=
            i%2===0
            ? "#168548"
            : "#0d6339";

        ctx.lineWidth=7;

        for(let j=0;j<3;j++){

            ctx.beginPath();

            ctx.moveTo(
                x,
                H*.82
            );

            ctx.quadraticCurveTo(
                x-15+j*15,
                H*.82-height/2,
                x-10+j*10,
                H*.82-height
            );

            ctx.stroke();

        }

    }

}


/* =========================
   BUBBLES
========================= */

function drawBubbles(){

    for(let b of bubbles){

        b.y-=b.speed;

        if(b.y<0.05){

            b.y=.82;
            b.x=Math.random();

        }

        ctx.strokeStyle="rgba(255,255,255,.6)";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.arc(
            b.x*W,
            b.y*H,
            b.size,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

}


/* =========================
   FISH
========================= */

function drawFish(f){

    f.x += f.dx*.00035;

    if(f.x>1.1){

        f.x=-.1;

    }

    if(f.x<-.1){

        f.x=1.1;

    }

    let x=f.x*W;

    let y=
        f.y*H+
        Math.sin(Date.now()*.003+f.x*10)*8;

    let size=Math.min(W,H)*.065;

    ctx.save();

    ctx.translate(x,y);

    if(f.dx<0){

        ctx.scale(-1,1);

    }


    /* tail */

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.moveTo(
        -size*.6,
        0
    );

    ctx.lineTo(
        -size*1.2,
        -size*.5
    );

    ctx.lineTo(
        -size*1.2,
        size*.5
    );

    ctx.closePath();

    ctx.fill();


    /* body */

    let g=ctx.createRadialGradient(
        -size*.3,
        -size*.3,
        2,
        0,
        0,
        size
    );

    g.addColorStop(
        0,
        "#ffffff"
    );

    g.addColorStop(
        .25,
        f.color
    );

    g.addColorStop(
        1,
        f.color
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        size,
        size*.58,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* fin */

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.moveTo(
        -size*.1,
        -size*.35
    );

    ctx.lineTo(
        size*.15,
        -size*.85
    );

    ctx.lineTo(
        size*.4,
        -size*.25
    );

    ctx.closePath();

    ctx.fill();


    /* eye */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        size*.55,
        -size*.18,
        size*.17,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        size*.60,
        -size*.18,
        size*.07,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* shine */

    ctx.fillStyle="rgba(255,255,255,.5)";

    ctx.beginPath();

    ctx.ellipse(
        -size*.3,
        -size*.25,
        size*.25,
        size*.1,
        -.3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   CASTLE
========================= */

function drawCastle(){

    let x=W*.18;
    let y=H*.76;

    let s=Math.min(W,H)*.10;

    ctx.fillStyle="#c9944c";

    ctx.fillRect(
        x-s*.7,
        y-s*.8,
        s*1.4,
        s
    );

    ctx.fillRect(
        x-s*1.05,
        y-s*1.05,
        s*.35,
        s*1.25
    );

    ctx.fillRect(
        x+s*.70,
        y-s*1.05,
        s*.35,
        s*1.25
    );

    ctx.fillStyle="#9e4035";

    ctx.beginPath();

    ctx.moveTo(
        x-s*1.12,
        y-s*1.05
    );

    ctx.lineTo(
        x-s*.88,
        y-s*1.45
    );

    ctx.lineTo(
        x-s*.64,
        y-s*1.05
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x+s*.64,
        y-s*1.05
    );

    ctx.lineTo(
        x+s*.88,
        y-s*1.45
    );

    ctx.lineTo(
        x+s*1.12,
        y-s*1.05
    );

    ctx.fill();

    ctx.fillStyle="#54351f";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        s*.23,
        Math.PI,
        0
    );

    ctx.fill();

}


/* =========================
   CHEST
========================= */

function drawChest(){

    let x=W*.75;
    let y=H*.82;

    let s=Math.min(W,H)*.055;

    ctx.fillStyle="#70421f";

    ctx.fillRect(
        x-s,
        y-s*.3,
        s*2,
        s
    );

    ctx.fillStyle="#b87328";

    ctx.beginPath();

    ctx.arc(
        x,
        y-s*.25,
        s,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.fillStyle="#e8c044";

    ctx.fillRect(
        x-s*.1,
        y-s*.2,
        s*.2,
        s*.65
    );

}


/* =========================
   RENDER
========================= */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    drawPlants();

    drawCastle();

    drawChest();

    drawBubbles();

    for(let f of fishes){

        drawFish(f);

    }

    drawSand();

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    render();

    requestAnimationFrame(loop);

}


/* =========================
   BUTTONS
========================= */

function feed(){

    if(coins<5){

        alert("Coin tak cukup!");

        return;

    }

    coins-=5;

    document.getElementById("coins").textContent=coins;

    alert("🍤 Ikan dah diberi makan!");

}


function addFish(){

    if(coins<20){

        alert("Coin tak cukup!");

        return;

    }

    coins-=20;

    fishes.push({

        x:Math.random(),

        y:.25+
          Math.random()*.4,

        dx:Math.random()<.5?1:-1,

        color:[
            "#ff6b35",
            "#ff4fa3",
            "#39d353",
            "#8b5cf6",
            "#ffd21f"
        ][
            Math.floor(
                Math.random()*5
            )
        ]

    });

    document.getElementById("coins").textContent=coins;

}


function breed(){

    if(coins<30){

        alert("Coin tak cukup!");

        return;

    }

    coins-=30;

    document.getElementById("coins").textContent=coins;

    alert("🥚 Telur ikan berjaya dihasilkan!");

}


function clean(){

    alert("🧽 Aquarium sudah bersih!");

}


/* =========================
   START
========================= */

loop();

</script>

</body>
</html>
