<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Happy Aquarium 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071d2b;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* TOP UI */

#top{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.title{
    color:white;
    background:rgba(0,35,55,.72);
    padding:9px 13px;
    border-radius:14px;
    backdrop-filter:blur(8px);
    box-shadow:0 3px 12px #0005;
}

.title b{
    font-size:18px;
}

.title small{
    display:block;
    margin-top:2px;
    opacity:.8;
}

.coins{
    background:#ffe36a;
    color:#573c00;
    padding:10px 14px;
    border-radius:22px;
    font-weight:bold;
    box-shadow:0 3px 10px #0004;
}

/* BOTTOM UI */

#controls{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:20;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.gameBtn{
    border:0;
    min-height:48px;
    border-radius:14px;

    background:rgba(0,55,80,.86);
    color:white;

    font-weight:bold;
    font-size:13px;

    box-shadow:0 3px 10px #0005;
}

.gameBtn:active{
    transform:scale(.94);
}

#message{
    position:fixed;
    left:50%;
    bottom:72px;
    transform:translateX(-50%);

    z-index:20;

    width:max-content;
    max-width:90%;

    padding:9px 14px;

    background:rgba(255,255,255,.9);
    color:#173744;

    border-radius:20px;

    font-size:13px;
    text-align:center;

    box-shadow:0 3px 12px #0004;
}

/* BREEDING */

#breeding{
    display:none;

    position:fixed;
    inset:0;

    z-index:50;

    background:rgba(0,20,30,.82);

    padding:15px;
}

.breedBox{
    max-width:500px;
    margin:50px auto 0;

    background:white;
    border-radius:20px;

    padding:18px;

    max-height:80vh;
    overflow:auto;
}

.breedBox h2{
    margin-top:0;
}

.breedGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.breedChoice{
    border:3px solid #cde6ed;
    background:#effaff;
    border-radius:13px;
    padding:12px;
    font-size:15px;
}

.breedChoice.selected{
    border-color:#ff6ca8;
    background:#ffe5ef;
}

.closeBtn{
    width:100%;
    margin-top:12px;
    min-height:45px;
    border:0;
    border-radius:12px;
    background:#168db0;
    color:white;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:500px){

    #controls{
        grid-template-columns:repeat(4,1fr);
    }

    .gameBtn{
        font-size:11px;
    }

    .title b{
        font-size:15px;
    }

}
</style>
</head>

<body>

<div id="game"></div>


<!-- TOP -->

<div id="top">

    <div class="title">

        <b>🐠 Happy Aquarium 3D</b>

        <small>My Aquarium</small>

    </div>

    <div class="coins">

        🪙 <span id="coins">100</span>

    </div>

</div>


<!-- MESSAGE -->

<div id="message">
    Selamat datang ke aquarium 3D!
</div>


<!-- CONTROLS -->

<div id="controls">

    <button class="gameBtn"
            onclick="feedFish()">
        🍤 FEED
    </button>

    <button class="gameBtn"
            onclick="buyFish()">
        🐟 BUY
    </button>

    <button class="gameBtn"
            onclick="openBreeding()">
        💕 BREED
    </button>

    <button class="gameBtn"
            onclick="cleanTank()">
        🧽 CLEAN
    </button>

</div>


<!-- BREEDING -->

<div id="breeding">

    <div class="breedBox">

        <h2>💕 Breeding Centre</h2>

        <p>
            Pilih ikan jantan dan betina.
        </p>

        <div class="breedGrid">

            <button
                class="breedChoice"
                onclick="chooseMale(this)">
                🐠 Clownfish<br>
                ♂ Jantan
            </button>

            <button
                class="breedChoice"
                onclick="chooseFemale(this)">
                🐟 Blue Tang<br>
                ♀ Betina
            </button>

            <button
                class="breedChoice"
                onclick="chooseMale(this)">
                🐡 Puffer<br>
                ♂ Jantan
            </button>

            <button
                class="breedChoice"
                onclick="chooseFemale(this)">
                🐠 Goldfish<br>
                ♀ Betina
            </button>

        </div>

        <p id="breedText">
            Belum pilih ikan.
        </p>

        <button
            class="closeBtn"
            onclick="startBreeding()">
            💕 MULA BREEDING — 10
