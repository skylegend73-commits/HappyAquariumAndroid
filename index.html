<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ocean Home Aquarium</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#08213b;color:white;
}
button{border:0;cursor:pointer;font-weight:bold}

#game{
 width:100%;height:100%;
 display:flex;flex-direction:column;
 background:linear-gradient(#6fcde8,#087da9);
}

/* TOP */
#top{
 height:68px;display:flex;align-items:center;gap:7px;
 padding:7px;background:linear-gradient(#487da7,#244e72);
 box-shadow:0 3px 8px #0008;z-index:10;
}
.logo{
 font-size:19px;font-weight:bold;
 text-shadow:2px 2px #12334d;
 white-space:nowrap;
}
.stat{
 background:#123653dd;
 border:2px solid #8dd6f3;
 border-radius:11px;
 padding:4px 8px;
 text-align:center;
 min-width:66px;
}
.stat small{display:block;font-size:9px;color:#bdeaff}
.stat b{font-size:13px}

/* AQUARIUM */
#tankArea{
 flex:1;position:relative;padding:7px;min-height:0;
}
#tank{
 position:relative;width:100%;height:100%;
 overflow:hidden;
 border:7px solid #9ecbe0;
 border-radius:18px 18px 5px 5px;
 background:
 radial-gradient(circle at 20% 15%,#ffffff55 0 2%,transparent 3%),
 radial-gradient(circle at 70% 25%,#ffffff25 0 1%,transparent 2%),
 linear-gradient(#59d1ed,#1c9fc4 55%,#08698e);
 box-shadow:inset 0 0 35px #003c5c99;
}

#waterLight{
 position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(110deg,#ffffff22 0 8%,transparent 18% 70%,#ffffff15 80%,transparent);
}

#sand{
 position:absolute;left:0;right:0;bottom:0;height:17%;
 background:
 radial-gradient(circle at 20% 40%,#b98942 0 2px,transparent 3px),
 radial-gradient(circle at 70% 60%,#a97b39 0 2px,transparent 3px),
 linear-gradient(#f6dc98,#bd8d45);
 border-top:3px solid #ffe8ad;
}

/* DECOR */
.decor{
 position:absolute;z-index:2;
 filter:drop-shadow(0 5px 3px #003d4d99);
}
.castle{left:5%;bottom:8%;font-size:72px}
.rock{right:5%;bottom:7%;font-size:55px}
.plant1{left:39%;bottom:7%;font-size:57px}
.plant2{left:72%;bottom:7%;font-size:60px}

/* FISH */
#fishLayer{
 position:absolute;inset:0;z-index:5;
}
.fish{
 position:absolute;
 width:115px;height:75px;
 transition:left .08s linear,top .08s linear;
 filter:drop-shadow(0 4px 3px #003b50aa);
 touch-action:none;
}
.fish.selected{
 filter:drop-shadow(0 0 10px #fff27a);
}

/* bubbles */
.bubble{
 position:absolute;
 border:2px solid #d9fbff88;
 border-radius:50%;
 background:#ffffff22;
 animation:rise linear infinite;
 pointer-events:none;
 z-index:3;
}
@keyframes rise{
 from{transform:translateY(20px);opacity:.1}
 50%{opacity:.7}
 to{transform:translateY(-300px);opacity:0}
}

/* BOTTOM */
#toolbar{
 height:88px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:6px;
 padding:6px;
 background:linear-gradient(#386582,#173c59);
 border-top:3px solid #8cc5df;
 z-index:10;
}
.tool{
 min-width:62px;height:70px;
 border-radius:13px;
 color:white;
 background:linear-gradient(#72a8c8,#315b7b);
 border:2px solid #a8d8ed;
 box-shadow:0 4px 0 #102d43,inset 0 1px #fff8;
 text-shadow:1px 2px #16364d;
}
.tool span{display:block;font-size:25px}
.tool small{font-size:9px}

/* MODAL */
#modal{
 display:none;
 position:absolute;
 z-index:50;
 left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:min(94%,400px);
 max-height:82%;
 overflow:auto;
 color:#18364d;
 background:linear-gradient(#effaff,#c9e9f7);
 border:4px solid #5788a5;
 border-radius:18px;
 padding:14px;
 box-shadow:0 15px 45px #000b;
}
#modal h2{text-align:center;margin:2px 0 12px}
.close{
 float:right;
 width:30px;height:30px;
 border-radius:50%;
 background:#d9534f;color:white;
 font-size:20px;
}
.card{
 background:#ffffffaa;
 border:2px solid #79a6bd;
 border-radius:11px;
 padding:9px;
 margin:7px 0;
}
.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:6px;
}
.buy,.blue,.red{
 padding:9px 13px;
 border-radius:9px;
 color:white;
}
.buy{background:#389456}
.blue{background:#367fb4}
.red{background:#c94b47}

.progress{
 height:10px;background:#728996;
 border-radius:8px;overflow:hidden;margin:4px 0 7px;
}
.progress i{
 display:block;height:100%;background:#51ce69;
}

select{
 padding:8px;
 border-radius:8px;
 width:100%;
 margin-top:6px;
}

/* toast */
#toast{
 display:none;
 position:absolute;
 z-index:100;
 left:50%;top:78px;
 transform:translateX(-50%);
 background:#102c45ee;
 border:2px solid #8ad8fa;
 border-radius:12px;
 padding:9px 15px;
 box-shadow:0 4px 15px #0007;
}

/* START */
#start{
 position:absolute;
 z-index:200;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:linear-gradient(#278db9,#08243e);
}
.startBox{
 width:min(90%,390px);
 padding:25px;
 border:4px solid #a6e2fa;
 border-radius:25px;
 background:#153f61ee;
 box-shadow:0 15px 50px #0009;
}
.startBox h1{font-size:32px;margin:5px}
.startBox p{color:#cef3ff;line-height:1.5}
.startBtn{
 padding:15px 30px;
 border-radius:14px;
 background:#f4c94b;
 color:#523800;
 font-size:18px;
 box-shadow:0 4px #8e6810;
}

@media(max-width:600px){
 #top{height:62px}
 .logo{font-size:14px}
 .stat{min-width:55px;padding:3px 5px}
 .stat b{font-size:11px}
 .tool{min-width:51px;height:67px}
 .tool span{font-size:23px}
}
</style>
</head>

<body>

<div id="game">

<!-- TOP -->
<div id="top">
 <div class="logo">🐠 Ocean Home</div>

 <div class="stat">
  <small>💰 COINS</small>
  <b id="coins">500</b>
 </div>

 <div class="stat">
  <small>🍖 FOOD</small>
  <b id="food">30</b>
 </div>

 <div class="stat">
  <small>⭐ LEVEL</small>
  <b id="level">1</b>
 </div>

 <div class="stat">
  <small>🐟 FISH</small>
  <b id="fishCount">0/12</b>
 </div>
</div>

<!-- TANK -->
<div id="tankArea">

 <div id="tank">

  <div id="waterLight"></div>

  <div id="sand"></div>

  <div class="decor castle">🏰</div>
  <div class="decor rock">🪨</div>
  <div class="decor plant1">🌿</div>
  <div class="decor plant2">🌿</div>

  <div id="fishLayer"></div>

 </div>

</div>

<!-- TOOLBAR -->
<div id="toolbar">

 <button class="tool" onclick="feedAll()">
  <span>🍖</span>
  <small>FEED</small>
 </button>

 <button class="tool" onclick="breedMenu()">
  <span>🥚</span>
  <small>BREED</small>
 </button>

 <button class="tool" onclick="shop()">
  <span>🏪</span>
  <small>SHOP</small>
 </button>

 <button class="tool" onclick="myFish()">
  <span>🐟</span>
  <small>MY FISH</small>
 </button>

 <button class="tool" onclick="cleanTank()">
  <span>🧽</span>
  <small>CLEAN</small>
 </button>

 <button class="tool" onclick="saveGame();toast('💾 Game disimpan')">
  <span>💾</span>
  <small>SAVE</small>
 </button>

</div>
</div>

<div id="toast"></div>
<div id="modal"></div>

<!-- START -->
<div id="start">
 <div class="startBox">

  <h1>🐠 Ocean Home</h1>

  <p>
   Bina akuarium sendiri.<br>
   Bela ikan, bagi makan, breeding,
   tetaskan telur, jual ikan,
   beli ikan dan hias akuarium.
  </p>

  <button class="startBtn" onclick="startGame()">
   MASUK AKUARIUM
  </button>

 </div>
</div>

<script>

/* =========================
   DATA IKAN
========================= */

const TYPES=[
 {
  name:"Guppy Merah",
  body:"#ef5962",
  fin:"#ffb34d",
  price:80
 },
 {
  name:"Guppy Biru",
  body:"#36a8e6",
  fin:"#a8efff",
  price:90
 },
 {
  name:"Guppy Ungu",
  body:"#a66be7",
  fin:"#efb7ff",
  price:120
 },
 {
  name:"Guppy Emas",
  body:"#f0ad2e",
  fin:"#fff0a0",
  price:160
 },
 {
  name:"Tropical Hijau",
  body:"#43c57b",
  fin:"#b8ff9c",
  price:140
 }
];


/* =========================
   SAVE DATA
========================= */

let game =
JSON.parse(localStorage.getItem("OceanHomeSave")) ||
{
 coins:500,
 food:30,
 level:1,
 xp:0,
 nextId:4,

 fish:[
  {
   id:1,
   type:0,
   sex:"F",
   hunger:85,
   health:100,
   age:100,
   x:25,
   y:30,
   vx:.42,
   vy:.10
  },

  {
   id:2,
   type:1,
   sex:"M",
   hunger:80,
   health:100,
   age:100,
   x:60,
   y:46,
   vx:-.38,
   vy:.12
  },

  {
   id:3,
   type:3,
   sex:"F",
   hunger:90,
   health:100,
   age:100,
   x:43,
   y:60,
   vx:.32,
   vy:-.08
  }
 ],

 eggs:[]
};


let running=false;
let selectedFish=null;
let lastTime=performance.now();


/* =========================
   START
========================= */

function startGame(){

 document.getElementById("start").style.display="none";

 running=true;

 createBubbles();

 renderFish();

 updateHUD();

 requestAnimationFrame(loop);

 toast("🐠 Selamat datang!");

}


/* =========================
   SAVE
========================= */

function saveGame(){

 localStorage.setItem(
  "OceanHomeSave",
  JSON.stringify(game)
 );

}


/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById("coins").textContent=
 game.coins;

 document.getElementById("food").textContent=
 game.food;

 document.getElementById("level").textContent=
 game.level;

 document.getElementById("fishCount").textContent=
 game.fish.length+"/12";

}


/* =========================
   FISH SVG
========================= */

function fishSVG(f){

 const t=TYPES[f.type];

 const flip=f.vx<0 ? -1 : 1;

 return `

 <svg viewBox="0 0 120 78">

 <g transform="
 translate(${flip<0?120:0} 0)
 scale(${flip} 1)
 ">

 <!-- tail -->

 <path
 d="M35 38
 C10 10 5 15 7 38
 C5 61 14 68 35 39"
 fill="${t.fin}"
 stroke="#164c65"
 stroke-width="2"
 />

 <!-- body -->

 <ellipse
 cx="63"
 cy="39"
 rx="35"
 ry="24"
 fill="${t.body}"
 stroke="#164c65"
 stroke-width="2"
 />

 <!-- top fin -->

 <path
 d="M57 18
 Q70 3 80 20
 Q68 25 57 18"
 fill="${t.fin}"
 />

 <!-- bottom fin -->

 <path
 d="M58 59
 Q72 75 80 57
 Q68 54 58 59"
 fill="${t.fin}"
 />

 <!-- body shine -->

 <path
 d="M56 28 Q72 20 84 29"
 fill="none"
 stroke="#ffffff77"
 stroke-width="5"
 />

 <!-- eye -->

 <circle
 cx="83"
 cy="32"
 r="7"
 fill="white"
 />

 <circle
 cx="85"
 cy="32"
 r="3"
 fill="#111"
 />

 <!-- mouth -->

 <path
 d="M99 38 Q108 40 99 44"
 fill="none"
 stroke="#164c65"
 stroke-width="2"
 />

 </g>

 </svg>

 `;

}


/* =========================
   RENDER
========================= */

function renderFish(){

 const layer=document.getElementById("fishLayer");

 layer.innerHTML="";

 game.fish.forEach(f=>{

  const el=document.createElement("div");

  el.className=
   "fish"+
   (selectedFish===f.id?" selected":"");

  el.id="fish-"+f.id;

  el.style.left=f.x+"%";
  el.style.top=f.y+"%";

  el.innerHTML=fishSVG(f);

  el.onclick=function(){

   selectFish(f.id);

  };

  layer.appendChild(el);

 });

}


/* =========================
   GAME LOOP
========================= */

function loop(now){

 if(!running)return;

 let dt=Math.min(40,now-lastTime);

 lastTime=now;


 game.fish.forEach(f=>{

  f.x += f.vx*dt/16;
  f.y += f.vy*dt/16;


  if(f.x<3){

   f.x=3;
   f.vx=Math.abs(f.vx);

  }

  if(f.x>82){

   f.x=82;
   f.vx=-Math.abs(f.vx);

  }

  if(f.y<8){

   f.y=8;
   f.vy=Math.abs(f.vy);

  }

  if(f.y>72){

   f.y=72;
   f.vy=-Math.abs(f.vy);

  }


  /* hunger */

  f.hunger -= dt/1000/40;

  if(f.hunger<0)
   f.hunger=0;


  /* health */

  if(f.hunger<15){

   f.health -= dt/1000/30;

   if(f.health<0)
    f.health=0;

  }
  else{

   if(f.health<100)
    f.health += dt/1000/80;

   if(f.health>100)
    f.health=100;

  }


  /* age */

  f.age += dt/1000/1200;

 });


 /* eggs */

 game.eggs.forEach(e=>{

  e.time -= dt/1000;

 });


 const ready=
 game.eggs.filter(e=>e.time<=0);


 ready.forEach(e=>{

  hatchEgg(e);

 });


 game.eggs=
 game.eggs.filter(e=>e.time>0);


 /* update positions */

 game.fish.forEach(f=>{

  const el=document.getElementById("fish-"+f.id);

  if(el){

   el.style.left=f.x+"%";
   el.style.top=f.y+"%";

   el.innerHTML=fishSVG(f);

  }

 });


 requestAnimationFrame(loop);

}


/* =========================
   SELECT FISH
========================= */

function selectFish(id){

 selectedFish=id;

 renderFish();

 const f=
 game.fish.find(x=>x.id===id);

 if(!f)return;

 const t=TYPES[f.type];

 openModal(`

 <button class="close"
 onclick="closeModal()">×</button>

 <h2>🐟 ${t.name}</h2>

 <div class="card">

 <b>Jantina:</b>
 ${f.sex==="M"?"♂ Jantan":"♀ Betina"}

 <br><br>

 <b>Umur:</b>
 ${Math.floor(f.age)}%

 <br><br>

 <b>Hunger:</b>
 ${Math.floor(f.hunger)}%

 <div class="progress">
  <i style="width:${f.hunger}%"></i>
 </div>

 <b>Health:</b>
 ${Math.floor(f.health)}%

 <div class="progress">
  <i style="width:${f.health}%"></i>
 </div>

 </div>

 <div class="row">

 <button class="blue"
 onclick="feedFish(${id})">
 🍖 BAGI MAKAN
 </button>

 <button class="red"
 onclick="sellFish(${id})">
 💰 JUAL
 </button>

 </div>

 `);

}


/* =========================
   FEED ALL
========================= */

function feedAll(){

 if(game.food<=0){

  toast("🍖 Food habis!");

  return;

 }

 game.food--;

 game.fish.forEach(f=>{

  f.hunger=Math.min(
   100,
   f.hunger+20
  );

  f.health=Math.min(
   100,
   f.health+5
  );

 });

 addXP(8);

 saveGame();

 updateHUD();

 toast("🍖 Semua ikan dah makan!");

}


/* =========================
   FEED SINGLE
========================= */

function feedFish(id){

 if(game.food<=0){

  toast("🍖 Food habis!");

  return;

 }

 const f=
 game.fish.find(x=>x.id===id);

 if(!f)return;

 game.food--;

 f.hunger=
 Math.min(100,f.hunger+35);

 f.health=
 Math.min(100,f.health+8);

 addXP(5);

 saveGame();

 updateHUD();

 selectFish(id);

 toast("🍖 Ikan dah kenyang!");

}


/* =========================
   SELL
========================= */

function sellFish(id){

 if(game.fish.length<=1){

  toast("Simpan sekurang-kurangnya 1 ikan.");

  return;

 }

 const index=
 game.fish.findIndex(f=>f.id===id);

 const f=game.fish[index];

 const money=
 TYPES[f.type].price+
 Math.floor(f.age);

 game.coins+=money;

 game.fish.splice(index,1);

 selectedFish=null;

 addXP(12);

 saveGame();

 updateHUD();

 closeModal();

 renderFish();

 toast("💰 +"+money+" coins");

}


/* =========================
   BREED MENU
========================= */

function breedMenu(){

 const males=
 game.fish.filter(f=>f.sex==="M");

 const females=
 game.fish.filter(f=>f.sex==="F");


 if(!males.length ||
    !females.length){

  openModal(`

  <button class="close"
  onclick="closeModal()">×</button>

  <h2>🥚 Breeding</h2>

  <div class="card">
   Perlu sekurang-kurangnya
   <b>1 jantan + 1 betina</b>.
  </div>

  `);

  return;

 }


 openModal(`

 <button class="close"
 onclick="closeModal()">×</button>

 <h2>🥚 BREEDING</h2>

 <div class="card">

 <b>♂ Pilih Jantan</b>

 <select id="maleSelect">

 ${males.map(f=>`

 <option value="${f.id}">
 ${TYPES[f.type].name} #${f.id}
 </option>

 `).join("")}

 </select>

 </div>


 <div class="card">

 <b>♀ Pilih Betina</b>

 <select id="femaleSelect">

 ${females.map(f=>`

 <option value="${f.id}">
 ${TYPES[f.type].name} #${f.id}
 </option>

 `).join("")}

 </select>

 </div>


 <button class="buy"
 onclick="breed()">

 🥚 BREED — 50 COINS

 </button>


 <div class="card">

 <b>🥚 Telur:</b>

 ${game.eggs.length}

 <br><br>

 ${
 game.eggs.length
 ?
 game.eggs.map(e=>
 "🥚 "+Math.ceil(e.time)+" saat"
 ).join("<br>")
 :
 "Tiada telur"
 }

 </div>

 `);

}


/* =========================
   BREED
========================= */

function breed(){

 if(game.coins<50){

  toast("💰 Coins tak cukup.");

  return;

 }

 if(game.fish.length>=12){

  toast("🐟 Akuarium penuh.");

  return;

 }

 const m=
 game.fish.find(
  f=>f.id==document.getElementById("maleSelect").value
 );

 const f=
 game.fish.find(
  f=>f.id==document.getElementById("femaleSelect").value
 );


 if(!m||!f)return;


 if(m.hunger<30 ||
    f.hunger<30){

  toast("🍖 Ikan terlalu lapar.");

  return;

 }


 game.coins-=50;

 m.hunger-=15;
 f.hunger-=15;


 const babyType=
 Math.random()<.5
 ?m.type
 :f.type;


 game.eggs.push({

  time:20,

  type:babyType,

  sex:
   Math.random()<.5
   ?"M"
   :"F"

 });


 addXP(25);

 saveGame();

 updateHUD();

 breedMenu();

 toast("🥚 Telur berjaya dihasilkan!");

}


/* =========================
   HATCH
========================= */

function hatchEgg(e){

 if(game.fish.length>=12){

  return;

 }


 game.fish.push({

  id:game.nextId++,

  type:e.type,

  sex:e.sex,

  hunger:100,

  health:100,

  age:5,

  x:20+Math.random()*55,

  y:20+Math.random()*45,

  vx:
   (Math.random()<.5?-1:1)*.3,

  vy:
   (Math.random()<.5?-1:1)*.12

 });


 addXP(20);

 saveGame();

 updateHUD();

 renderFish();

 toast("🥚➡️🐟 Telur menetas!");

}


/* =========================
   SHOP
========================= */

function shop(){

 openModal(`

 <button class="close"
 onclick="closeModal()">×</button>

 <h2>🏪 AQUARIUM SHOP</h2>


 <div class="card">

 <div class="row">

 <b>🍖 Food ×10</b>

 <b>30 coins</b>

 </div>

 <br>

 <button class="buy"
 onclick="buyFood()">

 BELI

 </button>

 </div>


 ${TYPES.map((t,i)=>`

 <div class="card">

 <div class="row">

 <b>🐟 ${t.name}</b>

 <b>${t.price}</b>

 </div>

 <br>

 <button class="buy"
 onclick="buyFish(${i})">

 BELI IKAN

 </button>

 </div>

 `).join("")}


 <div class="card">

 <b>🏰 Dekorasi Aquarium</b>

 <p>
 Tambah dekorasi unik dalam aquarium.
 </p>

 <button class="buy"
 onclick="buyDecor()">

 🪸 BELI — 100

 </button>

 </div>

 `);

}


/* =========================
   BUY FOOD
========================= */

function buyFood(){

 if(game.coins<30){

  toast("💰 Coins tak cukup.");

  return;

 }

 game.coins-=30;

 game.food+=10;

 saveGame();

 updateHUD();

 shop();

 toast("🍖 Food +10");

}


/* =========================
   BUY FISH
========================= */

function buyFish(type){

 if(game.fish.length>=12){

  toast("🐟 Aquarium penuh.");

  return;

 }


 if(game.coins<TYPES[type].price){

  toast("💰 Coins tak cukup.");

  return;

 }


 game.coins-=TYPES[type].price;


 game.fish.push({

  id:game.nextId++,

  type:type,

  sex:
   Math.random()<.5
   ?"M"
   :"F",

  hunger:100,

  health:100,

  age:100,

  x:15+Math.random()*60,

  y:15+Math.random()*50,

  vx:
   (Math.random()<.5?-1:1)*.35,

  vy:.1

 });


 addXP(10);

 saveGame();

 updateHUD();

 renderFish();

 shop();

 toast("🐟 Ikan baru masuk!");

}


/* =========================
   DECOR
========================= */

function buyDecor(){

 if(game.coins<100){

  toast("💰 Coins tak cukup.");

  return;

 }

 game.coins-=100;

 const decor=
 document.createElement("div");

 decor.className="decor";

 decor.textContent=
 Math.random()<.5
 ?"🪸"
 :"🪵";

 decor.style.left=
 (10+Math.random()*75)+"%";

 decor.style.bottom="7%";

 decor.style.fontSize="55px";

 document.getElementById("tank")
 .appendChild(decor);

 saveGame();

 updateHUD();

 toast("✨ Dekorasi baru!");

}


/* =========================
   MY FISH
========================= */

function myFish(){

 const list=
 game.fish.map(f=>`

 <div class="card">

 <div class="row">

 <b>
 🐟 ${TYPES[f.type].name}
 </b>

 <b>
 ${f.sex==="M"?"♂":"♀"}
 </b>

 </div>

 Hunger: ${Math.floor(f.hunger)}%

 <br>

 Health: ${Math.floor(f.health)}%

 <br><br>

 <button class="blue"
 onclick="selectFish(${f.id})">

 LIHAT

 </button>

 </div>

 `).join("");


 openModal(`

 <button class="close"
 onclick="closeModal()">×</button>

 <h2>🐟 IKAN SAYA</h2>

 ${list}

 `);

}


/* =========================
   CLEAN
========================= */

function cleanTank(){

 game.fish.forEach(f=>{

  f.health=
  Math.min(100,f.health+10);

 });


 addXP(10);

 saveGame();

 toast("🧽 Aquarium dah bersih!");

}


/* =========================
   XP
========================= */

function addXP(amount){

 game.xp+=amount;

 const needed=
 100+(game.level*60);


 if(game.xp>=needed){

  game.xp-=needed;

  game.level++;

  game.coins+=100;

  toast(
   "🎉 LEVEL "+
   game.level+
   "! +100 coins"
  );

 }

 updateHUD();

}


/* =========================
   MODAL
========================= */

function openModal(content){

 const modal=
 document.getElementById("modal");

 modal.innerHTML=content;

 modal.style.display="block";

}


function closeModal(){

 document.getElementById("modal")
 .style.display="none";

 selectedFish=null;

 renderFish();

}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

 const t=
 document.getElementById("toast");

 t.textContent=message;

 t.style.display="block";

 clearTimeout(toastTimer);

 toastTimer=
 setTimeout(()=>{

  t.style.display="none";

 },1800);

}


/* =========================
   BUBBLES
========================= */

function createBubbles(){

 const tank=
 document.getElementById("tank");

 for(let i=0;i<25;i++){

  const b=
  document.createElement("i");

  b.className="bubble";

  const size=
  4+Math.random()*12;

  b.style.width=size+"px";
  b.style.height=size+"px";

  b.style.left=
  Math.random()*96+"%";

  b.style.bottom=
  (8+Math.random()*25)+"%";

  b.style.animationDuration=
  (4+Math.random()*7)+"s";

  b.style.animationDelay=
  (-Math.random()*8)+"s";

  tank.appendChild(b);

 }

}


/* =========================
   AUTO SAVE
========================= */

setInterval(()=>{

 saveGame();

},15000);


/* =========================
   INIT
========================= */

updateHUD();

</script>
