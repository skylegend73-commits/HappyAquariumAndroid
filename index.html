<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Aquarium</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#b7edff,#eefcff);
    color:#173b45;
}

.game{
    max-width:700px;
    margin:auto;
    padding:12px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    padding:12px;
    border-radius:16px;
    margin-bottom:10px;
    box-shadow:0 3px 12px #0002;
}

.top h2{
    margin:0 0 3px;
}

.coins{
    background:#fff0a6;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
}

/* AQUARIUM */

.aquarium{
    height:400px;
    position:relative;
    overflow:hidden;
    border:7px solid #527a87;
    border-radius:23px;

    background:
    radial-gradient(
        ellipse at 30% 10%,
        #ffffff45,
        transparent 25%
    ),
    linear-gradient(
        to bottom,
        #a7eafa 0%,
        #58c8e3 42%,
        #219dbd 75%,
        #13758e 100%
    );

    box-shadow:
    inset 0 0 35px #0003,
    0 5px 16px #0003;
}

/* CAHAYA AIR */

.aquarium:before{
    content:"";
    position:absolute;
    width:180%;
    height:180px;
    top:-100px;
    left:-40%;
    background:linear-gradient(
        110deg,
        transparent 30%,
        #fff3 45%,
        transparent 60%
    );
    transform:rotate(-7deg);
    pointer-events:none;
}

/* BUBBLE */

.bubble{
    position:absolute;
    width:9px;
    height:9px;
    border:2px solid #ffffffaa;
    border-radius:50%;
    bottom:80px;
    animation:bubble 5s linear infinite;
    z-index:4;
}

.b1{left:15%}
.b2{left:42%;animation-delay:1.5s}
.b3{left:68%;animation-delay:3s}
.b4{left:86%;animation-delay:2s}

@keyframes bubble{
    0%{transform:translateY(0);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-310px);opacity:0}
}

/* SAND */

.sand{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:78px;
    z-index:8;

    background:
    radial-gradient(circle at 10% 30%,#a8874b88 0 2px,transparent 3px),
    radial-gradient(circle at 25% 70%,#9c7a4188 0 2px,transparent 3px),
    radial-gradient(circle at 42% 25%,#b08c4c88 0 2px,transparent 3px),
    radial-gradient(circle at 60% 65%,#9b773f88 0 2px,transparent 3px),
    radial-gradient(circle at 78% 30%,#b18c5088 0 2px,transparent 3px),
    radial-gradient(circle at 92% 65%,#96733d88 0 2px,transparent 3px),
    linear-gradient(#f5e4aa,#dfc47d);

    box-shadow:
    inset 0 10px 12px #fff5,
    inset 0 -8px 15px #76501f33;
}

.sand:after{
    content:"🐚     🪨       🐚          🪨       🐚";
    position:absolute;
    bottom:7px;
    left:5%;
    font-size:15px;
    opacity:.7;
}

/* PLANTS */

.plant{
    position:absolute;
    bottom:58px;
    font-size:58px;
    z-index:9;
    animation:sway 3s ease-in-out infinite;
}

.plant1{left:2%}
.plant2{left:43%;animation-delay:1s}
.plant3{right:3%;animation-delay:2s}

@keyframes sway{
    0%,100%{transform:rotate(-3deg)}
    50%{transform:rotate(3deg)}
}

/* =================================================
   REALISTIC SVG FISH
================================================= */

.fish{
    position:absolute;
    width:100px;
    height:65px;
    z-index:15;
    cursor:pointer;
    transition:left .12s linear;
    filter:drop-shadow(3px 5px 4px #0004);
}

.fish svg{
    width:100%;
    height:100%;
    overflow:visible;
}

/* ikan 1 */

#fish1{
    left:12%;
    top:22%;
}

/* ikan 2 */

#fish2{
    left:58%;
    top:45%;
    width:110px;
    height:70px;
}

/* ikan 3 */

#fish3{
    left:30%;
    top:57%;
    width:90px;
    height:65px;
}

/* =================================================
   PENYU
================================================= */

.turtle{
    position:absolute;
    left:55%;
    top:32%;
    width:115px;
    height:85px;
    z-index:16;
    filter:drop-shadow(4px 6px 5px #0004);
    animation:turtleBob 2s ease-in-out infinite;
    cursor:pointer;
}

.turtle-shell{
    position:absolute;
    left:23px;
    top:12px;
    width:67px;
    height:56px;
    background:
    radial-gradient(circle at 35% 25%,#8dcc6b,#438747 58%,#214e2b);
    border:4px solid #194c29;
    border-radius:55%;
    z-index:4;
}

.turtle-shell:before{
    content:"";
    position:absolute;
    left:12px;
    top:8px;
    width:37px;
    height:34px;
    border:3px solid #245f34aa;
    border-radius:50%;
}

.turtle-head{
    position:absolute;
    right:0;
    top:26px;
    width:35px;
    height:31px;
    background:linear-gradient(135deg,#91d873,#438e48);
    border:4px solid #286335;
    border-radius:55%;
    z-index:7;
}

.turtle-head:before{
    content:"";
    position:absolute;
    right:6px;
    top:6px;
    width:7px;
    height:7px;
    background:#111;
    border-radius:50%;
}

.turtle-leg{
    position:absolute;
    width:35px;
    height:21px;
    background:#579c50;
    border:4px solid #286335;
    border-radius:60%;
    z-index:3;
}

.leg1{
    left:7px;
    top:7px;
    transform:rotate(-35deg);
}

.leg2{
    left:7px;
    bottom:4px;
    transform:rotate(35deg);
}

.leg3{
    right:17px;
    top:3px;
    transform:rotate(35deg);
}

.leg4{
    right:17px;
    bottom:2px;
    transform:rotate(-35deg);
}

@keyframes turtleBob{
    0%,100%{
        transform:translateY(0) rotate(-2deg)
    }
    50%{
        transform:translateY(-6px) rotate(2deg)
    }
}

/* PANEL */

.panel{
    background:#fff;
    border-radius:16px;
    padding:12px;
    margin-top:10px;
    box-shadow:0 3px 10px #0002;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

button{
    min-height:48px;
    border:0;
    border-radius:12px;
    background:#168db0;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

.message{
    margin-top:10px;
    padding:10px;
    background:#eefaff;
    border-radius:10px;
    text-align:center;
}

/* BREEDING */

.breed-area{
    display:none;
}

.fish-choice{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.choice{
