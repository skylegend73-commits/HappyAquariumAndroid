<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Aquarium</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #bdefff;
  color: #123;
}

.game {
  max-width: 700px;
  margin: auto;
  padding: 12px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 12px;
  border-radius: 15px;
  margin-bottom: 10px;
}

.coins {
  background: #fff3a8;
  padding: 8px 12px;
  border-radius: 20px;
  font-weight: bold;
}

.aquarium {
  height: 360px;
  position: relative;
  overflow: hidden;
  border: 6px solid #5b8795;
  border-radius: 20px;
  background: linear-gradient(
    #8de0f5 0%,
    #3eb6d5 65%,
    #16839d 100%
  );
}

.sand {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 55px;
  background: #e7d39a;
}

.plant {
  position: absolute;
  bottom: 38px;
  font-size: 55px;
}

.fish {
  position: absolute;
  font-size: 45px;
  cursor: pointer;
  user-select: none;
  transition: left 0.3s linear;
}

.panel {
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin-top: 10px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

button {
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  background: #168db0;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.breed-area {
  display: none;
}

.fish-choice {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.choice {
  background: #eefaff;
  border: 3px solid #c5dce5;
  color: #123;
  padding: 10px;
}

.choice.selected {
  border-color: #ff69a8;
  background: #ffe1ef;
}

.parent-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0;
}

.parent {
  text-align: center;
  background: #f2fbff;
  padding: 12px;
  border-radius: 12px;
  font-size: 40px;
}

.egg {
  text-align: center;
  font-size: 60px;
  padding: 15px;
}

.message {
  margin-top: 10px;
  padding: 10px;
  background: #eefaff;
  border-radius: 10px;
}

@media (max-width: 450px) {
  .aquarium {
    height: 320px;
  }

  .fish-choice {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="top">
    <div>
      <h2>🐠 Happy Aquarium</h2>
      <small>My Aquarium</small>
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>
  </div>

  <div class="aquarium" id="aquarium">

    <div class="plant" style="left:5%;">🌿</div>
    <div class="plant" style="left:82%;">🌿</div>
    <div class="plant" style="left:45%;">🪸</div>

    <div class="sand"></div>

    <div id="fish1" class="fish" style="left:15%;top:30%;">
      🐠
    </div>

    <div id="fish2" class="fish" style="left:60%;top:55%;">
      🐟
    </div>

  </div>

  <div class="panel">

    <div class="buttons">

      <button onclick="feedFish()">
        🍤 FEED
      </button>

      <button onclick="buyFish()">
        🐟 BUY FISH
      </button>

      <button onclick="openBreeding()">
        💕 BREEDING
      </button>

      <button onclick="cleanTank()">
        🧽 CLEAN
      </button>

    </div>

    <div class="message" id="message">
      Selamat datang ke Happy Aquarium! 🐠
    </div>

  </div>


  <!-- BREEDING -->

  <div class="panel breed-area" id="breeding">

    <h2>💕 Breeding</h2>

    <p>
      Pilih seekor ikan jantan dan seekor ikan betina.
    </p>

    <div class="fish-choice">

      <button class="choice" onclick="selectMale(this,'🐠')">
        🐠<br>
        Nemo<br>
        ♂ Jantan
      </button>

      <button class="choice" onclick="selectFemale(this,'🐟')">
        🐟<br>
        Blue<br>
        ♀ Betina
      </button>

      <button class="choice" onclick="selectMale(this,'🐡')">
        🐡<br>
        Puffy<br>
        ♂ Jantan
      </button>

      <button class="choice" onclick="selectFemale(this,'🐠')">
        🐠<br>
        Goldie<br>
        ♀ Betina
      </button>

      <button class="choice" onclick="selectMale(this,'🐟')">
        🐟<br>
        Stripe<br>
        ♂ Jantan
      </button>

      <button class="choice" onclick="selectFemale(this,'🐡')">
        🐡<br>
        Pearl<br>
        ♀ Betina
      </button>

    </div>


    <div class="parent-box">

      <div class="parent">
        <div id="male">❔</div>
        <small>♂ Jantan</small>
      </div>

      <div class="parent">
        <div id="female">❔</div>
        <small>♀ Betina</small>
      </div>

    </div>


    <button onclick="startBreeding()">
      💕 MULA BREEDING — 10 🪙
    </button>


    <div class="egg" id="egg">
      🥚
    </div>

    <div id="breedStatus" style="text-align:center;">
      Belum ada breeding.
    </div>

    <br>

    <button onclick="closeBreeding()">
      ← Kembali Aquarium
    </button>

  </div>

</div>


<script>

let coins = 100;

let male = null;
let female = null;

let breeding = false;


/* COIN */

function updateCoins() {

  document.getElementById("coins").textContent = coins;

}


/* MESSAGE */

function message(text) {

  document.getElementById("message").textContent = text;

}


/* FEED */

function feedFish() {

  if (coins < 2) {

    message("🪙 Coin tak cukup.");

    return;

  }

  coins -= 2;

  updateCoins();

  message(
    "🍤 Ikan dah makan! Happiness meningkat ❤️"
  );

}


/* BUY FISH */

function buyFish() {

  if (coins < 20) {

    message("🪙 Perlu 20 coin untuk beli ikan.");

    return;

  }

  coins -= 20;

  updateCoins();

  let aquarium =
    document.getElementById("aquarium");

  let fish =
    document.createElement("div");

  fish.className = "fish";

  fish.textContent =
    ["🐠","🐟","🐡"][Math.floor(Math.random()*3)];

  fish.style.left =
    (10 + Math.random()*75) + "%";

  fish.style.top =
    (20 + Math.random()*50) + "%";

  aquarium.appendChild(fish);

  message(
    "🎉 Ikan baru telah masuk aquarium!"
  );

}


/* CLEAN */

function cleanTank() {

  message(
    "🧽 Aquarium sudah bersih! Ikan gembira ❤️"
  );

}


/* OPEN BREEDING */

function openBreeding() {

  document.getElementById(
    "breeding"
  ).style.display = "block";

  document.getElementById(
    "message"
  ).textContent =
    "💕 Pilih jantan dan betina.";

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* CLOSE BREEDING */

function closeBreeding() {

  document.getElementById(
    "breeding"
  ).style.display = "none";

}


/* SELECT MALE */

function selectMale(button, fish) {

  male = fish;

  document.getElementById(
    "male"
  ).textContent = fish;

  button.classList.add("selected");

}


/* SELECT FEMALE */

function selectFemale(button, fish) {

  female = fish;

  document.getElementById(
    "female"
  ).textContent = fish;

  button.classList.add("selected");

}


/* BREEDING */

function startBreeding() {

  if (breeding) {

    return;

  }

  if (!male || !female) {

    document.getElementById(
      "breedStatus"
    ).textContent =
      "⚠️ Pilih JANTAN dan BETINA dahulu.";

    return;

  }

  if (coins < 10) {

    document.getElementById(
      "breedStatus"
    ).textContent =
      "🪙 Coin tak cukup.";

    return;

  }

  coins -= 10;

  updateCoins();

  breeding = true;

  let seconds = 10;

  document.getElementById(
    "egg"
  ).textContent = "🥚";

  document.getElementById(
    "breedStatus"
  ).textContent =
    "💕 Breeding berjaya! Telur sedang berkembang...";

  let timer = setInterval(function() {

    seconds--;

    document.getElementById(
      "breedStatus"
    ).textContent =
      "🥚 Telur menetas dalam " +
      seconds +
      " saat...";

    if (seconds <= 0) {

      clearInterval(timer);

      document.getElementById(
        "egg"
      ).textContent = "🐣";

      document.getElementById(
        "breedStatus"
      ).textContent =
        "🎉 Telur menetas! Anak ikan baru lahir! 🐠";

      setTimeout(function() {

        document.getElementById(
          "egg"
        ).textContent = "🐠";

      }, 2000);

      breeding = false;

    }

  },1000);

}


/* FISH MOVEMENT */

let direction1 = 1;
let direction2 = -1;

setInterval(function() {

  let f1 =
    document.getElementById("fish1");

  let f2 =
    document.getElementById("fish2");

  let x1 =
    parseFloat(f1.style.left);

  let x2 =
    parseFloat(f2.style.left);

  x1 += direction1 * 0.5;

  x2 += direction2 * 0.5;

  if (x1 > 80 || x1 < 5) {

    direction1 *= -1;

  }

  if (x2 > 80 || x2 < 5) {

    direction2 *= -1;

  }

  f1.style.left = x1 + "%";

  f2.style.left = x2 + "%";

},100);


updateCoins();

</script>

</body>
</html>
