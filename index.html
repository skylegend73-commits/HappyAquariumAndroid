<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Aquarium</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#b9efff, #e9fbff);
  color: #123;
}

.game {
  max-width: 700px;
  margin: auto;
  padding: 12px;
}

/* =========================
   TOP
========================= */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 12px;
  border-radius: 15px;
  margin-bottom: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

.top h2 {
  margin: 0 0 4px;
}

.coins {
  background: #fff0a6;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

/* =========================
   AQUARIUM
========================= */

.aquarium {
  height: 390px;
  position: relative;
  overflow: hidden;

  border: 7px solid #547d89;
  border-radius: 22px;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.35),
      transparent 20%
    ),
    linear-gradient(
      to bottom,
      #9deaff 0%,
      #57c9e5 45%,
      #249ebd 75%,
      #177e9b 100%
    );

  box-shadow:
    inset 0 0 30px rgba(0,0,0,.18),
    0 5px 15px rgba(0,0,0,.2);
}

/* Cahaya air */

.aquarium::before {
  content: "";
  position: absolute;
  top: -100px;
  left: 10%;
  width: 80%;
  height: 180px;

  background:
    linear-gradient(
      110deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform: rotate(-8deg);
  pointer-events: none;
}

/* =========================
   BUBBLES
========================= */

.bubble {
  position: absolute;
  bottom: 80px;

  width: 9px;
  height: 9px;

  border: 2px solid rgba(255,255,255,.7);
  border-radius: 50%;

  animation: bubbleUp 5s linear infinite;
}

.b1 {
  left: 20%;
}

.b2 {
  left: 48%;
  animation-delay: 2s;
}

.b3 {
  left: 75%;
  animation-delay: 1s;
}

.b4 {
  left: 88%;
  animation-delay: 3s;
}

@keyframes bubbleUp {

  0% {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: .8;
  }

  100% {
    transform: translateY(-300px);
    opacity: 0;
  }
}

/* =========================
   PASIR DASAR LAUT
========================= */

.sand {
  position: absolute;

  bottom: 0;
  left: 0;

  width: 100%;
  height: 75px;

  background:

    radial-gradient(
      circle at 8% 30%,
      rgba(120,90,45,.35) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 18% 70%,
      rgba(150,115,60,.4) 0 1.5px,
      transparent 2.5px
    ),

    radial-gradient(
      circle at 30% 25%,
      rgba(120,90,45,.3) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 42% 65%,
      rgba(160,125,70,.4) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 55% 35%,
      rgba(120,90,45,.3) 0 1.5px,
      transparent 2.5px
    ),

    radial-gradient(
      circle at 68% 70%,
      rgba(150,110,55,.35) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 80% 30%,
      rgba(120,90,45,.3) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 92% 65%,
      rgba(150,110,55,.35) 0 2px,
      transparent 3px
    ),

    linear-gradient(
      to bottom,
      #f5e3aa,
      #ead294 45%,
      #d8bd76
    );

  box-shadow:
    inset 0 10px 12px rgba(255,255,255,.25),
    inset 0 -8px 15px rgba(120,85,35,.2);

  z-index: 3;
}

.sand::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    repeating-radial-gradient(
      ellipse at 50% 100%,
      rgba(255,255,255,.18) 0px,
      rgba(255,255,255,.18) 2px,
      transparent 3px,
      transparent 13px
    );

  opacity: .55;
}

.sand::after {
  content: "🪨    🐚       🪨    🐚          🪨     🐚";

  position: absolute;

  bottom: 7px;
  left: 4%;

  width: 92%;

  font-size: 15px;
  letter-spacing: 5px;

  opacity: .7;
}

/* =========================
   TUMBUHAN
========================= */

.plant {
  position: absolute;
  bottom: 60px;

  font-size: 58px;

  z-index: 4;

  animation: plantMove 3s ease-in-out infinite;
}

.plant1 {
  left: 3%;
}

.plant2 {
  left: 42%;
  animation-delay: 1s;
}

.plant3 {
  right: 3%;
  animation-delay: 2s;
}

@keyframes plantMove {

  0%,100% {
    transform: rotate(-3deg);
  }

  50% {
    transform: rotate(3deg);
  }
}

/* =========================
   IKAN
========================= */

.fish {
  position: absolute;

  font-size: 46px;

  cursor: pointer;
  user-select: none;

  z-index: 10;

  transition: left .2s linear;

  filter:
    drop-shadow(2px 3px 3px rgba(0,0,0,.18));
}

/* =========================
   PENYU CSS
========================= */

.turtle {

  position: absolute;

  left: 55%;
  top: 32%;

  width: 90px;
  height: 70px;

  z-index: 15;

  cursor: pointer;

  transition: left .25s linear;

  filter:
    drop-shadow(3px 5px 4px rgba(0,0,0,.25));

  animation: turtleBob 2s ease-in-out infinite;
}

/* Tempurung */

.turtle-shell {

  position: absolute;

  left: 20px;
  top: 13px;

  width: 55px;
  height: 47px;

  background:
    radial-gradient(
      circle at 35% 30%,
      #6fae58,
      #3d803c 55%,
      #255f31 100%
    );

  border: 3px solid #204f2b;

  border-radius: 50% 50% 48% 48%;

  transform: rotate(-5deg);

  z-index: 3;
}

/* Corak tempurung */

.turtle-shell::before {

  content: "";

  position: absolute;

  left: 10px;
  top: 7px;

  width: 30px;
  height: 26px;

  border: 3px solid rgba(20,70,35,.55);

  border-radius: 50%;
}

/* Kepala */

.turtle-head {

  position: absolute;

  right: 0;
  top: 24px;

  width: 27px;
  height: 25px;

  background:
    radial-gradient(
      circle at 35% 30%,
      #83c76b,
      #438e48
    );

  border: 3px solid #286335;

  border-radius: 55% 50% 50% 55%;

  z-index: 5;
}

/* Mata */

.turtle-head::before {

  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  background: #111;

  border-radius: 50%;

  right: 5px;
  top: 5px;
}

/* Kaki */

.turtle-leg {

  position: absolute;

  width: 28px;
  height: 17px;

  background: #579c50;

  border: 3px solid #286335;

  border-radius: 60%;

  z-index: 2;
}

.leg1 {
  left: 10px;
  top: 9px;
  transform: rotate(-35deg);
}

.leg2 {
  left: 8px;
  bottom: 7px;
  transform: rotate(35deg);
}

.leg3 {
  right: 16px;
  top: 5px;
  transform: rotate(35deg);
}

.leg4 {
  right: 17px;
  bottom: 4px;
  transform: rotate(-35deg);
}

/* Animasi penyu */

@keyframes turtleBob {

  0%,100% {
    transform: translateY(0) rotate(-2deg);
  }

  50% {
    transform: translateY(-5px) rotate(2deg);
  }
}

/* =========================
   PANEL
========================= */

.panel {

  background: white;

  border-radius: 15px;

  padding: 12px;

  margin-top: 10px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.1);
}

.buttons {

  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 8px;
}

button {

  min-height: 48px;

  border: 0;

  border-radius: 12px;

  background: #168db0;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.message {

  margin-top: 10px;

  padding: 10px;

  background: #eefaff;

  border-radius: 10px;

  text-align: center;
}

/* =========================
   BREEDING
========================= */

.breed-area {
  display: none;
}

.fish-choice {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 8px;
}

.choice {

  background: #eefaff;

  border: 3px solid #c5dce5;

  color: #123;

  padding: 10px;

  min-height: 90px;
}

.choice.selected {

  border-color: #ff69a8;

  background: #ffe1ef;
}

.parent-box {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin: 12px 0;
}

.parent {

  text-align: center;

  background: #f2fbff;

  padding: 12px;

  border-radius: 12px;

  font-size: 40px;
}

.egg {

  text-align: center;

  font-size: 60px;

  padding: 15px;
}

#breedStatus {

  text-align: center;

  font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width:450px) {

  .aquarium {
    height: 350px;
  }

  .fish-choice {
    grid-template-columns:
      repeat(2,1fr);
  }

  .fish {
    font-size: 40px;
  }

  .turtle {
    transform: scale(.9);
  }
}

</style>
</head>

<body>

<div class="game">

<!-- =====================
     TOP
===================== -->

<div class="top">

  <div>

    <h2>🐠 Happy Aquarium</h2>

    <small>
      My Aquarium
    </small>

  </div>

  <div class="coins">

    🪙
    <span id="coins">100</span>

  </div>

</div>


<!-- =====================
     AQUARIUM
===================== -->

<div
  class="aquarium"
  id="aquarium">


  <!-- BUBBLES -->

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>


  <!-- PLANTS -->

  <div class="plant plant1">
    🌿
  </div>

  <div class="plant plant2">
    🪸
  </div>

  <div class="plant plant3">
    🌿
  </div>


  <!-- FISH 1 -->

  <div
    id="fish1"
    class="fish"
    style="left:15%;top:25%;"
    onclick="fishClicked('Sunny')">

    🐠

  </div>


  <!-- FISH 2 -->

  <div
    id="fish2"
    class="fish"
    style="left:62%;top:48%;"
    onclick="fishClicked('Bluey')">

    🐟

  </div>


  <!-- FISH 3 -->

  <div
    id="fish3"
    class="fish"
    style="left:35%;top:58%;"
    onclick="fishClicked('Puffy')">

    🐡

  </div>


  <!-- =================
       PENYU
  ================== -->

  <div
    id="turtle1"
    class="turtle"
    onclick="turtleClicked()">


    <div class="turtle-leg leg1"></div>

    <div class="turtle-leg leg2"></div>

    <div class="turtle-leg leg3"></div>

    <div class="turtle-leg leg4"></div>


    <div class="turtle-shell"></div>

    <div class="turtle-head"></div>


  </div>


  <!-- SAND -->

  <div class="sand"></div>

</div>


<!-- =====================
     BUTTONS
===================== -->

<div class="panel">

  <div class="buttons">

    <button onclick="feedFish()">
      🍤 FEED
    </button>

    <button onclick="buyFish()">
      🐟 BUY FISH
    </button>

    <button onclick="openBreeding()">
      💕 BREEDING
    </button>

    <button onclick="cleanTank()">
      🧽 CLEAN
    </button>

  </div>


  <div
    class="message"
    id="message">

    Selamat datang ke Happy Aquarium! 🐠

  </div>

</div>


<!-- =====================
     BREEDING
===================== -->

<div
  class="panel breed-area"
  id="breeding">


  <h2>
    💕 Breeding Centre
  </h2>


  <p>
    Pilih seekor ikan jantan dan seekor ikan betina.
  </p>


  <div class="fish-choice">


    <button
      class="choice"
      onclick="selectMale(this,'🐠')">

      🐠
      <br>
      Sunny
      <br>
      ♂ Jantan

    </button>


    <button
      class="choice"
      onclick="selectFemale(this,'🐟')">

      🐟
      <br>
      Bluey
      <br>
      ♀ Betina

    </button>


    <button
      class="choice"
      onclick="selectMale(this,'🐡')">

      🐡
      <br>
      Puffy
      <br>
      ♂ Jantan

    </button>


    <button
      class="choice"
      onclick="selectFemale(this,'🐠')">

      🐠
      <br>
      Goldie
      <br>
      ♀ Betina

    </button>


    <button
      class="choice"
      onclick="selectMale(this,'🐟')">

      🐟
      <br>
      Stripe
      <br>
      ♂ Jantan

    </button>


    <button
      class="choice"
      onclick="selectFemale(this,'🐡')">

      🐡
      <br>
      Pearl
      <br>
      ♀ Betina

    </button>


  </div>


  <div class="parent-box">


    <div class="parent">

      <div id="male">
        ❔
      </div>

      <small>
        ♂ Jantan
      </small>

    </div>


    <div class="parent">

      <div id="female">
        ❔
      </div>

      <small>
        ♀ Betina
      </small>

    </div>


  </div>


  <button onclick="startBreeding()">

    💕 MULA BREEDING — 10 🪙

  </button>


  <div
    class="egg"
    id="egg">

    🥚

  </div>


  <div id="breedStatus">

    Belum ada breeding.

  </div>


  <br>


  <button onclick="closeBreeding()">

    ← Kembali Aquarium

  </button>


</div>

</div>


<script>

/* =========================
   GAME DATA
========================= */

let coins = 100;

let male = null;

let female = null;

let breeding = false;


/* =========================
   COINS
========================= */

function updateCoins() {

  document
    .getElementById("coins")
    .textContent = coins;

}


/* =========================
   MESSAGE
========================= */

function message(text) {

  document
    .getElementById("message")
    .textContent = text;

}


/* =========================
   FISH CLICK
========================= */

function fishClicked(name) {

  message(
    "🐠 " +
    name +
    " suka bila hang usik dia! ❤️"
  );

}


/* =========================
   TURTLE CLICK
========================= */

function turtleClicked() {

  message(
    "🐢 Penyu sedang berenang dalam aquarium! ❤️"
  );

}


/* =========================
   FEED
========================= */

function feedFish() {

  if (coins < 2) {

    message(
      "🪙 Coin tak cukup untuk makanan."
    );

    return;
  }


  coins -= 2;

  updateCoins();


  message(
    "🍤 Semua ikan dan penyu dah makan! ❤️"
  );

}


/* =========================
   BUY FISH
========================= */

function buyFish() {

  if (coins < 20) {

    message(
      "🪙 Perlu 20 coin untuk beli ikan."
    );

    return;
  }


  coins -= 20;

  updateCoins();


  const aquarium =
    document.getElementById("aquarium");


  const fish =
    document.createElement("div");


  fish.className =
    "fish";


  const fishTypes = [
    "🐠",
    "🐟",
    "🐡"
  ];


  fish.textContent =
    fishTypes[
      Math.floor(
        Math.random() *
        fishTypes.length
      )
    ];


  fish.style.left =
    (10 + Math.random() * 75)
    + "%";


  fish.style.top =
    (15 + Math.random() * 55)
    + "%";


  aquarium.appendChild(fish);


  message(
    "🎉 Ikan baru telah masuk aquarium!"
  );

}


/* =========================
   CLEAN
========================= */

function cleanTank() {

  message(
    "🧽 Aquarium sudah bersih! Semua haiwan gembira ❤️"
  );

}


/* =========================
   OPEN BREEDING
========================= */

function openBreeding() {

  document
    .getElementById("breeding")
    .style.display =
    "block";


  document
    .getElementById("message")
    .textContent =
    "💕 Pilih ikan jantan dan betina.";


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


/* =========================
   CLOSE BREEDING
========================= */

function closeBreeding() {

  document
    .getElementById("breeding")
    .style.display =
    "none";

}


/* =========================
   MALE
========================= */

function selectMale(button, fish) {

  male = fish;

  document
    .getElementById("male")
    .textContent =
    fish;

  button.classList.add(
    "selected"
  );

}


/* =========================
   FEMALE
========================= */

function selectFemale(button, fish) {

  female = fish;

  document
    .getElementById("female")
    .textContent =
    fish;

  button.classList.add(
    "selected"
  );

}


/* =========================
   BREEDING
========================= */

function startBreeding() {

  if (breeding) {
    return;
  }


  if (!male || !female) {

    document
      .getElementById("breedStatus")
      .textContent =
      "⚠️ Pilih JANTAN dan BETINA dahulu.";

    return;
  }


  if (coins < 10) {

    document
      .getElementById("breedStatus")
      .textContent =
      "🪙 Coin tak cukup.";

    return;
  }


  coins -= 10;

  updateCoins();

  breeding = true;


  let seconds = 10;


  document
    .getElementById("egg")
    .textContent =
    "🥚";


  document
    .getElementById("breedStatus")
    .textContent =
    "💕 Breeding berjaya! Telur sedang berkembang...";


  const timer =
    setInterval(function() {

      seconds--;


      document
        .getElementById("breedStatus")
        .textContent =
        "🥚 Telur menetas dalam "
        + seconds
        + " saat...";


      if (seconds <= 0) {

        clearInterval(timer);


        document
          .getElementById("egg")
          .textContent =
          "🐣";


        document
          .getElementById("breedStatus")
          .textContent =
          "🎉 Telur menetas! Anak ikan baru lahir! 🐠";


        setTimeout(function() {

          document
            .getElementById("egg")
            .textContent =
            "🐠";

        },2000);


        breeding = false;

      }

    },1000);

}


/* =========================
   FISH MOVEMENT
========================= */

let direction1 = 1;

let direction2 = -1;

let direction3 = 1;


setInterval(function() {

  const f1 =
    document.getElementById("fish1");

  const f2 =
    document.getElementById("fish2");

  const f3 =
    document.getElementById("fish3");


  let x1 =
    parseFloat(f1.style.left);


  let x2 =
    parseFloat(f2.style.left);


  let x3 =
    parseFloat(f3.style.left);


  x1 +=
    direction1 * .45;


  x2 +=
    direction2 * .35;


  x3 +=
    direction3 * .25;


  if (x1 > 82 || x1 < 5) {
    direction1 *= -1;
  }


  if (x2 > 82 || x2 < 5) {
    direction2 *= -1;
  }


  if (x3 > 82 || x3 < 5) {
    direction3 *= -1;
  }


  f1.style.left =
    x1 + "%";


  f2.style.left =
    x2 + "%";


  f3.style.left =
    x3 + "%";


},100);


/* =========================
   TURTLE MOVEMENT
========================= */

let turtleDirection = -1;


setInterval(function() {

  const turtle =
    document.getElementById("turtle1");


  if (!turtle) {
    return;
  }


  let x =
    parseFloat(
      turtle.style.left
    );


  x +=
    turtleDirection * .18;


  if (x > 80 || x < 8) {

    turtleDirection *= -1;

  }


  turtle.style.left =
    x + "%";


},100);


/* =========================
   START
========================= */

updateCoins();

</script>

</body>
</html>
